[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "axiom-body"
version = "0.3.0"
description = "Mind-side semantic embodiment adapter for Axiom"
requires-python = ">=3.11"

[tool.setuptools]
packages = ["axiom_body"]

[project.optional-dependencies]
bridge = ["fastapi>=0.100", "uvicorn>=0.20"]
test = ["websockets>=12"]
