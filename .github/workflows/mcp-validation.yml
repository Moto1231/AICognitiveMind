name: MCP branch validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/mcp-interface]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Validate MCP server import
        run: python -c "import aicognitive_mind.mcp_server; print('MCP server import OK')"
