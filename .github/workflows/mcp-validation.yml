name: Project validation

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      MONGODB_TEST_URI: mongodb://127.0.0.1:27017/?replicaSet=rs0&directConnection=true

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Start disposable Mongo replica set for transaction tests
        run: |
          docker run -d --name axiom-test-mongo -p 27017:27017 mongo:7 --replSet rs0 --bind_ip_all
          for attempt in $(seq 1 30); do
            if docker exec axiom-test-mongo mongosh --quiet --eval 'db.adminCommand({ping:1})'; then break; fi
            sleep 1
          done
          docker exec axiom-test-mongo mongosh --quiet --eval 'rs.initiate({_id:"rs0",members:[{_id:0,host:"localhost:27017"}]})'
          for attempt in $(seq 1 30); do
            if docker exec axiom-test-mongo mongosh --quiet --eval 'if (!db.hello().isWritablePrimary) { quit(1); }'; then exit 0; fi
            sleep 1
          done
          exit 1

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Validate MCP server import
        run: python -c "import aicognitive_mind.mcp_server; print('MCP server import OK')"

      - name: Validate canonical Surreal migration utility
        run: python scripts/surreal_canonical.py --help

      - name: Validate two-process persistent host handoff
        run: python scripts/mcp_handoff_smoke.py

      - name: Run MCP stdio continuity smoke test on SurrealDB
        env:
          STORAGE_PROVIDER: surreal
          SURREALDB_URI: mem://
          SURREALDB_NAMESPACE: ci
          SURREALDB_DATABASE: cognitive_mind_stdio
        run: python scripts/mcp_stdio_smoke.py

      - name: Start MCP HTTP server on SurrealDB
        env:
          STORAGE_PROVIDER: surreal
          SURREALDB_URI: mem://
          SURREALDB_NAMESPACE: ci
          SURREALDB_DATABASE: cognitive_mind_http
        run: |
          python -m aicognitive_mind.mcp_server > /tmp/mcp-server.log 2>&1 &
          echo $! > /tmp/mcp-server.pid

      - name: Wait for MCP HTTP server
        run: |
          python - <<'PY'
          import socket
          import time

          deadline = time.time() + 30
          while time.time() < deadline:
              try:
                  with socket.create_connection(("127.0.0.1", 8001), timeout=1):
                      print("MCP HTTP server port is open")
                      break
              except OSError:
                  time.sleep(0.5)
          else:
              raise SystemExit("MCP HTTP server did not open port 8001")
          PY

      - name: Run MCP HTTP continuity smoke test
        env:
          MCP_URL: http://127.0.0.1:8001/mcp
        run: python scripts/mcp_smoke.py

      - name: Show MCP server log on failure
        if: failure()
        run: cat /tmp/mcp-server.log || true
