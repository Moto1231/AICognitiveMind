name: Project validation

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  mongo-retrieval:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      mongodb:
        image: mongo:8.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping: 1})'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MONGODB_TEST_URI: mongodb://localhost:27017
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: pip install -e .
      - name: Verify indexed recall on existing Mongo history
        run: python -m unittest discover -s tests -p test_mongo_retrieval.py -v

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      STORAGE_PROVIDER: surreal

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Set up Node.js for portal behavior checks
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify portal editing and task configuration
        run: node --test tests/portal_editors.test.cjs

      - name: Validate MCP server import
        run: python -c "import aicognitive_mind.mcp_server; print('MCP server import OK')"

      - name: Validate ChatGPT MCP deployment assembly
        env:
          STORAGE_PROVIDER: surreal
          APP_ACCESS_USERNAME: mind
          APP_ACCESS_PASSWORD: ci-test-password
        run: python -c "from aicognitive_mind.deployment import app; assert app is not None"

      - name: Validate canonical Surreal migration utility
        run: python scripts/surreal_canonical.py --help

      - name: Validate two-process persistent host handoff
        run: python scripts/mcp_handoff_smoke.py

      - name: Run MCP stdio continuity smoke test on SurrealDB
        env:
          STORAGE_PROVIDER: surreal
          SURREALDB_URI: mem://
          SURREALDB_NAMESPACE: ci
          SURREALDB_DATABASE: cognitive_mind_stdio
        run: python scripts/mcp_stdio_smoke.py

      - name: Start MCP HTTP server on SurrealDB
        env:
          STORAGE_PROVIDER: surreal
          SURREALDB_URI: mem://
          SURREALDB_NAMESPACE: ci
          SURREALDB_DATABASE: cognitive_mind_http
        run: |
          python -m aicognitive_mind.mcp_server > /tmp/mcp-server.log 2>&1 &
          echo $! > /tmp/mcp-server.pid

      - name: Wait for MCP HTTP server
        run: |
          python - <<'PY'
          import socket
          import time

          deadline = time.time() + 30
          while time.time() < deadline:
              try:
                  with socket.create_connection(("127.0.0.1", 8001), timeout=1):
                      print("MCP HTTP server port is open")
                      break
              except OSError:
                  time.sleep(0.5)
          else:
              raise SystemExit("MCP HTTP server did not open port 8001")
          PY

      - name: Run MCP HTTP continuity smoke test
        env:
          MCP_URL: http://127.0.0.1:8001/mcp
        run: python scripts/mcp_smoke.py

      - name: Show MCP server log on failure
        if: failure()
        run: cat /tmp/mcp-server.log || true
