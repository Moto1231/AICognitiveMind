name: Canonical Atlas

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "Safe Atlas operation"
        required: true
        default: check
        type: choice
        options:
          - check
          - genesis
      self_name:
        description: "Self-name used only for genesis"
        required: false
        default: AICognitiveMind
        type: string

concurrency:
  group: canonical-atlas
  cancel-in-progress: false

jobs:
  atlas:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Require canonical Atlas secret
        env:
          MONGODB_URI: ${{ secrets.CANONICAL_MONGODB_URI }}
        run: |
          if [ -z "$MONGODB_URI" ]; then
            echo "Repository secret CANONICAL_MONGODB_URI is not configured."
            exit 1
          fi

      - name: Check canonical Atlas
        if: ${{ inputs.operation == 'check' }}
        env:
          MONGODB_URI: ${{ secrets.CANONICAL_MONGODB_URI }}
          MONGODB_DATABASE: ai_cognitive_mind
          STORAGE_PROVIDER: mongo
        run: python scripts/atlas_canonical.py check

      - name: Initialize canonical Atlas Mind
        if: ${{ inputs.operation == 'genesis' }}
        env:
          MONGODB_URI: ${{ secrets.CANONICAL_MONGODB_URI }}
          MONGODB_DATABASE: ai_cognitive_mind
          STORAGE_PROVIDER: mongo
          MIND_SELF_NAME: ${{ inputs.self_name }}
        run: |
          python scripts/atlas_canonical.py genesis             --self-name "$MIND_SELF_NAME"             --value "Understanding before Recommending"             --value "Preserve continuity of identity"

      - name: Verify canonical Atlas after genesis
        if: ${{ inputs.operation == 'genesis' }}
        env:
          MONGODB_URI: ${{ secrets.CANONICAL_MONGODB_URI }}
          MONGODB_DATABASE: ai_cognitive_mind
          STORAGE_PROVIDER: mongo
        run: python scripts/atlas_canonical.py check
