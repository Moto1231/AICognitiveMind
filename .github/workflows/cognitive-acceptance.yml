name: Cognitive Acceptance

on:
  push:
    branches:
      - codex/autonomous-acceptance-loop
      - codex/ollama-reasoning-engine
    paths:
      - "src/**"
      - "tests/**"
      - "acceptance/**"
      - "scripts/run_acceptance.py"
      - "scripts/dev_sync.sh"
      - "scripts/codespace_start.sh"
      - "pyproject.toml"
      - ".github/workflows/cognitive-acceptance.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cognitive-acceptance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out tested commit
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project and development tools
        run: python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Type check
        run: mypy src/aicognitive_mind

      - name: Unit tests
        run: pytest -q

      - name: Live cognitive acceptance
        env:
          COGNITIVE_MIND_TEST_URL: ${{ secrets.COGNITIVE_MIND_TEST_URL || vars.COGNITIVE_MIND_TEST_URL }}
          EXPECTED_REVISION: ${{ github.sha }}
        run: python scripts/run_acceptance.py
