name: Cognitive Acceptance

on:
  push:
    branches:
      - codex/autonomous-acceptance-loop
      - codex/ollama-reasoning-engine
    paths:
      - "src/**"
      - "tests/**"
      - "acceptance/**"
      - "scripts/run_acceptance.py"
      - "scripts/dev_sync.sh"
      - "scripts/codespace_start.sh"
      - "pyproject.toml"
      - ".github/workflows/cognitive-acceptance.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cognitive-acceptance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      MONGODB_URI: mongodb://127.0.0.1:27017
      MONGODB_DATABASE: ai_cognitive_mind_acceptance
      REASONING_PROVIDER: echo
    services:
      mongodb:
        image: mongo:8.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'quit(db.adminCommand({ ping: 1 }).ok ? 0 : 1)'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Check out tested commit
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project and development tools
        run: python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Type check
        run: mypy src/aicognitive_mind

      - name: Unit tests
        run: pytest -q

      - name: Start acceptance Mind
        run: |
          nohup python -m uvicorn aicognitive_mind.api:app --host 127.0.0.1 --port 8000 > /tmp/aicognitive-mind.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8000/health >/dev/null; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8000/health
          curl -fsS -X POST http://127.0.0.1:8000/v1/mind/initialize             -H "Content-Type: application/json"             -d '{"self_name":"AICognitiveMind","foundational_values":["Understanding before Recommending","Preserve continuity of identity"]}'

      - name: Local cognitive acceptance
        env:
          COGNITIVE_MIND_TEST_URL: http://127.0.0.1:8000
          EXPECTED_REVISION: ${{ github.sha }}
        run: python scripts/run_acceptance.py
