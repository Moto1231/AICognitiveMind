name: Brilliant SDK validation

on:
  pull_request:
    branches: [main]
    paths:
      - "brilliant_sdk/**"
      - ".github/workflows/brilliant-sdk-validation.yml"
  workflow_dispatch:

concurrency:
  group: brilliant-sdk-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python and Lua parity
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: brilliant_sdk/python
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: brilliant_sdk/python/uv.lock

      - name: Install SDK workspace
        run: uv sync --all-packages --all-extras

      - name: Run Python and emulator tests
        run: uv run pytest -q

      - name: Check Lua parity across SDKs
        working-directory: .
        run: python brilliant_sdk/tools/check_lua_parity.py

  webbluetooth:
    name: WebBluetooth ${{ matrix.package }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: brilliant-ble
            test: true
          - package: brilliant-msg
            test: true
          - package: brilliant-sdk
            test: false
    defaults:
      run:
        working-directory: brilliant_sdk/webbluetooth/packages/${{ matrix.package }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: brilliant_sdk/webbluetooth/packages/${{ matrix.package }}/package-lock.json

      - name: Install package
        run: npm ci

      - name: Build package
        run: npm run build

      - name: Run package tests
        if: matrix.test
        run: npm test

  flutter:
    name: Flutter packages
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: brilliant_sdk/flutter
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.6"
          cache: true

      - name: Install Melos
        run: dart pub global activate melos 6.3.3

      - name: Add Dart global tools to PATH
        run: echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"

      - name: Bootstrap workspace
        run: melos bootstrap

      - name: Analyze Flutter workspace
        run: melos exec -- flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Run available Flutter tests
        shell: bash
        run: |
          set -euo pipefail
          found_tests=0
          for package_dir in packages/*; do
            test_dir="$package_dir/test"
            if [ -d "$test_dir" ]; then
              found_tests=1
              echo "Running Flutter tests in $test_dir"
              flutter test "$test_dir"
            fi
          done
          if [ "$found_tests" -eq 0 ]; then
            echo "No top-level Flutter package test directories are present; analysis is the available static gate."
          fi
