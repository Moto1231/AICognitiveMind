[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "aicognitive-mind"
version = "0.5.0"
description = "A model-independent cognitive core with persistent identity and memory"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "mcp>=2,<3",
    "openai>=1.100,<3",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.7,<3",
    "pymongo>=4.11,<5",
    "surrealdb>=2,<3",
    "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28,<1",
    "mypy>=1.14,<2",
    "pytest>=8.3,<10",
    "ruff>=0.9,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aicognitive_mind = ["static/*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["aicognitive_mind"]
