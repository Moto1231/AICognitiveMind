services:
  - type: web
    name: ai-cognitive-mind
    runtime: python
    region: ohio
    plan: free
    branch: main
    buildCommand: pip install .
    startCommand: uvicorn aicognitive_mind.deployment:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: APP_NAME
        value: Axiom
      - key: STORAGE_PROVIDER
        value: surreal
      - key: SURREALDB_URI
        sync: false
      - key: SURREALDB_NAMESPACE
        value: mir_ai
      - key: SURREALDB_DATABASE
        value: ai_cognitive_mind
      - key: SURREALDB_USERNAME
        sync: false
      - key: SURREALDB_PASSWORD
        sync: false
      - key: SURREALDB_AUTH_LEVEL
        value: database
      - key: REASONING_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: auto
      - key: APP_ACCESS_USERNAME
        value: mind
      - key: APP_ACCESS_PASSWORD
        sync: false
