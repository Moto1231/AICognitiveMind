services:
  - type: web
    name: ai-cognitive-mind
    runtime: python
    region: ohio
    plan: free
    branch: main
    buildCommand: pip install .
    startCommand: uvicorn aicognitive_mind.api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: APP_NAME
        value: AI Cognitive Mind
      - key: STORAGE_PROVIDER
        value: mongo
      - key: MONGODB_DATABASE
        value: ai_cognitive_mind
      - key: MONGODB_URI
        sync: false
      - key: REASONING_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: APP_ACCESS_USERNAME
        value: mind
      - key: APP_ACCESS_PASSWORD
        sync: false
