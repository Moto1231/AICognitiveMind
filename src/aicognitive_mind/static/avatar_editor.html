<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Axiom — Avatar Editor</title>
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; font-family: system-ui, sans-serif; background: #101114; color: #f2f2f2; }
    main { max-width: 1100px; margin: 0 auto; padding: 1.25rem; }
    .page-bar { display: flex; align-items: center; justify-content: space-between; gap: 1rem; margin-bottom: 1rem; }
    .page-bar h1 { margin: 0; font-size: 1.35rem; }
    .page-links { display: flex; gap: .6rem; flex-wrap: wrap; }
    a { color: #d7d9df; }
    .page-links a { padding: .55rem .8rem; border: 1px solid #373a44; border-radius: 8px; text-decoration: none; }
    #stage {
      width: 100%;
      height: clamp(340px, 52vh, 560px);
      background: #181a20;
      border-radius: 14px;
      overflow: hidden;
      margin-bottom: 1rem;
    }
    #stage canvas { display: block; width: 100%; height: 100%; }
    .editor { padding: 1rem; background: #181a20; border-radius: 14px; }
    .editor + .editor { margin-top: 1rem; }
    .editor h2 { margin: 0 0 .35rem; font-size: 1.1rem; }
    .editor-copy { margin: 0 0 1rem; color: #9da2ae; line-height: 1.45; font-size: .9rem; }
    .avatar-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: .85rem; }
    .avatar-field { display: flex; flex-direction: column; gap: .35rem; }
    .avatar-field label { color: #b9bcc4; font-size: .9rem; }
    .avatar-field input[type="color"] { width: 100%; min-height: 2.5rem; }
    .avatar-field input[type="range"] { width: 100%; }
    .avatar-field select,
    .avatar-field input[type="text"] {
      min-height: 2.55rem;
      padding: .55rem .65rem;
      border: 1px solid #373a44;
      border-radius: 9px;
      background: #101114;
      color: #f2f2f2;
      font: inherit;
    }
    .voice-wide { grid-column: 1 / -1; }
    .avatar-value { font-variant-numeric: tabular-nums; color: #d7d9df; }
    .controls { display: flex; flex-wrap: wrap; gap: .75rem; margin-top: 1rem; }
    button { padding: .7rem 1rem; font: inherit; cursor: pointer; }
    #status { color: #b9bcc4; min-height: 1.4rem; margin-top: .75rem; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/",
        "@pixiv/three-vrm": "https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@3.5.5/lib/three-vrm.module.min.js"
      }
    }
  </script>
</head>
<body>
  <script>
    const bodySessionId = crypto.randomUUID();
    async function bodyFetch(url, options = {}) {
      const headers = new Headers(options.headers || {});
      headers.set("X-Body-Session", bodySessionId);
      const response = await fetch(url, { ...options, headers, signal: options.signal || AbortSignal.timeout(130000) });
      const receipt = response.headers.get("X-Body-Delivery");
      if (response.ok && receipt) {
        await response.clone().arrayBuffer();
        const ack = await fetch(String(url).split("?")[0].replace(/\/next$/, "/ack") + "?delivery_id=" + encodeURIComponent(receipt),
          { method: "POST", headers, signal: AbortSignal.timeout(10000) });
        if (!ack.ok) throw new Error("Body delivery acknowledgment failed");
      }
      return response;
    }
  </script>

  <main>
    <div class="page-bar">
      <h1>Avatar Editor</h1>
      <div class="page-links">
        <a href="/" aria-label="Back to portal">← Portal</a>
        <a href="/body/live">Live Body</a>
      </div>
    </div>

    <div id="stage"></div>

    <section class="editor" aria-label="Avatar appearance controls">
      <h2>Appearance</h2>
      <div class="avatar-grid">
        <div class="avatar-field"><label for="skinColor">Skin</label><input id="skinColor" data-avatar-key="skinColor" type="color" value="#b88566"></div>
        <div class="avatar-field"><label for="hairColor">Hair</label><input id="hairColor" data-avatar-key="hairColor" type="color" value="#090a0d"></div>
        <div class="avatar-field"><label for="shirtColor">Shirt</label><input id="shirtColor" data-avatar-key="shirtColor" type="color" value="#2e4257"></div>
        <div class="avatar-field"><label for="pantsColor">Pants</label><input id="pantsColor" data-avatar-key="pantsColor" type="color" value="#1a1f29"></div>
        <div class="avatar-field"><label for="eyeColor">Eyes</label><input id="eyeColor" data-avatar-key="eyeColor" type="color" value="#090a0d"></div>
        <div class="avatar-field"><label for="shoeColor">Shoes</label><input id="shoeColor" data-avatar-key="shoeColor" type="color" value="#090a0d"></div>

        <div class="avatar-field"><label for="headSize">Head size <span class="avatar-value" data-avatar-value="headSize"></span></label><input id="headSize" data-avatar-key="headSize" type="range" min="0.75" max="1.35" step="0.01" value="1"></div>
        <div class="avatar-field"><label for="hairVolume">Hair volume <span class="avatar-value" data-avatar-value="hairVolume"></span></label><input id="hairVolume" data-avatar-key="hairVolume" type="range" min="0.60" max="1.60" step="0.01" value="1"></div>
        <div class="avatar-field"><label for="eyeSize">Eye size <span class="avatar-value" data-avatar-value="eyeSize"></span></label><input id="eyeSize" data-avatar-key="eyeSize" type="range" min="0.60" max="1.60" step="0.01" value="1"></div>
        <div class="avatar-field"><label for="eyeSpacing">Eye spacing <span class="avatar-value" data-avatar-value="eyeSpacing"></span></label><input id="eyeSpacing" data-avatar-key="eyeSpacing" type="range" min="0.65" max="1.45" step="0.01" value="1"></div>
        <div class="avatar-field"><label for="mouthWidth">Mouth width <span class="avatar-value" data-avatar-value="mouthWidth"></span></label><input id="mouthWidth" data-avatar-key="mouthWidth" type="range" min="0.60" max="1.50" step="0.01" value="1"></div>
        <div class="avatar-field"><label for="torsoWidth">Torso width <span class="avatar-value" data-avatar-value="torsoWidth"></span></label><input id="torsoWidth" data-avatar-key="torsoWidth" type="range" min="0.70" max="1.40" step="0.01" value="1"></div>
        <div class="avatar-field"><label for="shoulderWidth">Shoulder width <span class="avatar-value" data-avatar-value="shoulderWidth"></span></label><input id="shoulderWidth" data-avatar-key="shoulderWidth" type="range" min="0.75" max="1.40" step="0.01" value="1"></div>
        <div class="avatar-field"><label for="armThickness">Arm thickness <span class="avatar-value" data-avatar-value="armThickness"></span></label><input id="armThickness" data-avatar-key="armThickness" type="range" min="0.65" max="1.50" step="0.01" value="1"></div>
        <div class="avatar-field"><label for="legThickness">Leg thickness <span class="avatar-value" data-avatar-value="legThickness"></span></label><input id="legThickness" data-avatar-key="legThickness" type="range" min="0.65" max="1.50" step="0.01" value="1"></div>
      </div>

      <div class="controls">
        <button id="saveAvatarAppearance" type="button">Save appearance</button>
        <button id="resetAvatarAppearance" type="button">Reset Genesis</button>
      </div>
      <div id="status">Loading Genesis...</div>
    </section>

    <section class="editor" aria-label="Voice pack controls">
      <h2>Voice Pack</h2>
      <p class="editor-copy">
        Choose the browser or operating-system voice Genesis uses, then tune its delivery.
      </p>
      <div class="avatar-grid">
        <div class="avatar-field voice-wide">
          <label for="voiceSelect">Voice</label>
          <select id="voiceSelect">
            <option value="">System default</option>
          </select>
        </div>
        <div class="avatar-field">
          <label for="voiceRate">Rate <span id="voiceRateValue" class="avatar-value"></span></label>
          <input id="voiceRate" type="range" min="0.50" max="1.75" step="0.05" value="1">
        </div>
        <div class="avatar-field">
          <label for="voicePitch">Pitch <span id="voicePitchValue" class="avatar-value"></span></label>
          <input id="voicePitch" type="range" min="0.50" max="1.50" step="0.05" value="1">
        </div>
        <div class="avatar-field">
          <label for="voiceVolume">Volume <span id="voiceVolumeValue" class="avatar-value"></span></label>
          <input id="voiceVolume" type="range" min="0" max="1" step="0.05" value="1">
        </div>
        <div class="avatar-field voice-wide">
          <label for="voicePreviewText">Preview phrase</label>
          <input
            id="voicePreviewText"
            type="text"
            value="Hello. This is the voice I will use."
            maxlength="240"
          >
        </div>
      </div>
      <div class="controls">
        <button id="previewVoicePack" type="button">Preview voice</button>
        <button id="saveVoicePack" type="button">Save voice pack</button>
        <button id="resetVoicePack" type="button">Reset voice pack</button>
      </div>
      <div id="voiceStatus">Loading available voices...</div>
    </section>
  </main>

  <script type="module">
    import * as THREE from "three";
    import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";
    import { VRMLoaderPlugin, VRMUtils } from "@pixiv/three-vrm";
    import {
      AvatarCustomizer,
      DEFAULT_AVATAR_APPEARANCE,
      clearSavedAvatarAppearance,
      loadSavedAvatarAppearance,
      saveAvatarAppearance
    } from "/static/avatar_customizer.js";
    import {
      DEFAULT_VOICE_PACK,
      applyVoicePack,
      clearSavedVoicePack,
      loadSavedVoicePack,
      saveVoicePack
    } from "/static/voice_pack.js";

    const stage = document.getElementById("stage");
    const statusBox = document.getElementById("status");
    const avatarInputs = [...document.querySelectorAll("[data-avatar-key]")];
    const avatarValueLabels = [...document.querySelectorAll("[data-avatar-value]")];
    const saveButton = document.getElementById("saveAvatarAppearance");
    const resetButton = document.getElementById("resetAvatarAppearance");
    const voiceSelect = document.getElementById("voiceSelect");
    const voiceRate = document.getElementById("voiceRate");
    const voicePitch = document.getElementById("voicePitch");
    const voiceVolume = document.getElementById("voiceVolume");
    const voiceRateValue = document.getElementById("voiceRateValue");
    const voicePitchValue = document.getElementById("voicePitchValue");
    const voiceVolumeValue = document.getElementById("voiceVolumeValue");
    const voicePreviewText = document.getElementById("voicePreviewText");
    const previewVoicePackButton = document.getElementById("previewVoicePack");
    const saveVoicePackButton = document.getElementById("saveVoicePack");
    const resetVoicePackButton = document.getElementById("resetVoicePack");
    const voiceStatus = document.getElementById("voiceStatus");

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    stage.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(30, 1, 0.1, 50);
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;

    scene.add(new THREE.HemisphereLight(0xffffff, 0x333333, 2.0));
    const keyLight = new THREE.DirectionalLight(0xffffff, 2.4);
    keyLight.position.set(1.5, 2.5, 2.0);
    scene.add(keyLight);

    const loader = new GLTFLoader();
    loader.register((parser) => new VRMLoaderPlugin(parser));
    const clock = new THREE.Clock();
    let currentVrm = null;
    let avatarCustomizer = null;
    let pageSourceSnapshot = null;
    let pageRefreshProbeBusy = false;
    let availableVoices = [];

    function refreshVoiceValueLabels() {
      voiceRateValue.textContent = Number(voiceRate.value).toFixed(2);
      voicePitchValue.textContent = Number(voicePitch.value).toFixed(2);
      voiceVolumeValue.textContent = Number(voiceVolume.value).toFixed(2);
    }

    function writeVoicePackControls(pack) {
      voiceRate.value = String(pack.rate);
      voicePitch.value = String(pack.pitch);
      voiceVolume.value = String(pack.volume);
      refreshVoiceValueLabels();

      let match = null;
      if (pack.voiceURI) {
        match = [...voiceSelect.options].find(
          (option) => option.value === pack.voiceURI
        );
      }
      if (!match && pack.voiceName) {
        match = [...voiceSelect.options].find(
          (option) =>
            option.dataset.voiceName === pack.voiceName &&
            (!pack.lang || option.dataset.lang === pack.lang)
        );
      }
      voiceSelect.value = match?.value || "";
    }

    function readVoicePackControls() {
      const selected = voiceSelect.selectedOptions[0];
      return {
        voiceName: selected?.dataset.voiceName || "",
        voiceURI: selected?.value || "",
        lang: selected?.dataset.lang || "",
        rate: Number(voiceRate.value),
        pitch: Number(voicePitch.value),
        volume: Number(voiceVolume.value)
      };
    }

    function loadVoiceOptions() {
      if (!window.speechSynthesis) {
        voiceStatus.textContent = "Speech synthesis is not available in this browser.";
        return;
      }

      availableVoices = window.speechSynthesis.getVoices().slice().sort(
        (left, right) =>
          left.lang.localeCompare(right.lang) || left.name.localeCompare(right.name)
      );

      voiceSelect.replaceChildren();
      const defaultOption = document.createElement("option");
      defaultOption.value = "";
      defaultOption.textContent = "System default";
      voiceSelect.appendChild(defaultOption);

      for (const voice of availableVoices) {
        const option = document.createElement("option");
        option.value = voice.voiceURI;
        option.dataset.voiceName = voice.name;
        option.dataset.lang = voice.lang;
        option.textContent = voice.name + " — " + voice.lang;
        voiceSelect.appendChild(option);
      }

      const saved = loadSavedVoicePack();
      writeVoicePackControls(saved);
      voiceStatus.textContent = availableVoices.length
        ? availableVoices.length + " voices available in this browser."
        : "Waiting for browser voices...";
    }

    function previewVoicePack() {
      if (!window.speechSynthesis) {
        voiceStatus.textContent = "Speech synthesis is not available in this browser.";
        return;
      }
      const text = voicePreviewText.value.trim();
      if (!text) return;

      const utterance = new SpeechSynthesisUtterance(text);
      applyVoicePack(utterance, readVoicePackControls(), availableVoices);
      window.speechSynthesis.cancel();
      window.speechSynthesis.speak(utterance);
      voiceStatus.textContent = "Previewing current voice pack.";
    }

    async function checkForBodyPageUpdate() {
      if (document.hidden || pageRefreshProbeBusy) return;
      pageRefreshProbeBusy = true;
      try {
        const response = await bodyFetch(
          window.location.pathname + "?body_refresh_probe=" + Date.now(),
          { cache: "no-store" }
        );
        if (!response.ok) return;
        const source = await response.text();
        if (pageSourceSnapshot === null) {
          pageSourceSnapshot = source;
          return;
        }
        if (source !== pageSourceSnapshot) {
          window.location.reload();
        }
      } catch {
        // A failed update probe should not interfere with avatar editing.
      } finally {
        pageRefreshProbeBusy = false;
      }
    }

    function readControls() {
      const config = {};
      for (const input of avatarInputs) {
        config[input.dataset.avatarKey] =
          input.type === "range" ? Number(input.value) : input.value;
      }
      return config;
    }

    function writeControls(config) {
      for (const input of avatarInputs) {
        const value = config[input.dataset.avatarKey];
        if (value !== undefined) input.value = String(value);
      }
      const values = readControls();
      for (const label of avatarValueLabels) {
        const value = values[label.dataset.avatarValue];
        label.textContent = typeof value === "number" ? value.toFixed(2) : "";
      }
    }

    function applyControls() {
      writeControls(readControls());
      avatarCustomizer?.apply(readControls());
      statusBox.textContent = "Appearance changed. Save to keep it in this browser.";
    }

    function resize() {
      const width = stage.clientWidth;
      const height = stage.clientHeight;
      renderer.setSize(width, height, false);
      camera.aspect = width / height;
      camera.updateProjectionMatrix();
    }

    function frameAvatar(object, padding = 1.22) {
      const box = new THREE.Box3().setFromObject(object);
      if (box.isEmpty()) return;
      const size = box.getSize(new THREE.Vector3());
      const center = box.getCenter(new THREE.Vector3());
      const aspect = Math.max(0.25, camera.aspect || 1);
      const verticalFov = THREE.MathUtils.degToRad(camera.fov);
      const horizontalFov = 2 * Math.atan(Math.tan(verticalFov / 2) * aspect);
      const distance = Math.max(
        (size.y * padding) / (2 * Math.tan(verticalFov / 2)),
        (size.x * padding) / (2 * Math.tan(horizontalFov / 2)),
        1.5
      );
      camera.position.set(center.x, center.y, center.z + distance);
      camera.near = Math.max(0.01, distance / 100);
      camera.far = Math.max(50, distance * 20);
      camera.updateProjectionMatrix();
      controls.target.copy(center);
      controls.update();
    }

    function attachAvatar(gltf) {
      const vrm = gltf.userData.vrm;
      if (!vrm) {
        statusBox.textContent = "Genesis did not load as a VRM avatar.";
        return;
      }
      VRMUtils.removeUnnecessaryVertices(gltf.scene);
      VRMUtils.combineSkeletons(gltf.scene);
      VRMUtils.combineMorphs(vrm);
      VRMUtils.rotateVRM0(vrm);
      vrm.scene.traverse((object) => { object.frustumCulled = false; });
      currentVrm = vrm;
      scene.add(vrm.scene);
      avatarCustomizer = new AvatarCustomizer(vrm);
      const saved = loadSavedAvatarAppearance();
      writeControls(saved);
      avatarCustomizer.apply(saved);
      frameAvatar(vrm.scene);
      statusBox.textContent = "Saved browser appearance loaded.";
    }

    function animate() {
      requestAnimationFrame(animate);
      const delta = clock.getDelta();
      currentVrm?.update(delta);
      controls.update();
      renderer.render(scene, camera);
    }

    for (const input of avatarInputs) {
      input.addEventListener("input", applyControls);
    }

    saveButton.addEventListener("click", () => {
      if (!avatarCustomizer) return;
      const saved = saveAvatarAppearance(readControls());
      writeControls(saved);
      avatarCustomizer.apply(saved);
      statusBox.textContent = "Appearance saved.";
    });

    resetButton.addEventListener("click", () => {
      clearSavedAvatarAppearance();
      writeControls(DEFAULT_AVATAR_APPEARANCE);
      avatarCustomizer?.reset();
      statusBox.textContent = "Genesis reset to default appearance.";
    });

    for (const input of [voiceRate, voicePitch, voiceVolume]) {
      input.addEventListener("input", refreshVoiceValueLabels);
    }
    previewVoicePackButton.addEventListener("click", previewVoicePack);
    saveVoicePackButton.addEventListener("click", () => {
      const saved = saveVoicePack(readVoicePackControls());
      writeVoicePackControls(saved);
      voiceStatus.textContent = "Voice pack saved.";
    });
    resetVoicePackButton.addEventListener("click", () => {
      clearSavedVoicePack();
      writeVoicePackControls(DEFAULT_VOICE_PACK);
      window.speechSynthesis?.cancel();
      voiceStatus.textContent = "Voice pack reset to system default.";
    });

    window.addEventListener("resize", resize);
    document.addEventListener("visibilitychange", () => {
      if (!document.hidden) checkForBodyPageUpdate();
    });
    writeControls(DEFAULT_AVATAR_APPEARANCE);
    writeVoicePackControls(loadSavedVoicePack());
    loadVoiceOptions();
    if (window.speechSynthesis) {
      window.speechSynthesis.onvoiceschanged = loadVoiceOptions;
    }
    resize();
    animate();
    checkForBodyPageUpdate();
    window.setInterval(checkForBodyPageUpdate, 12_000);
    loader.load(
      "/v1/body/face/avatar",
      attachAvatar,
      undefined,
      (error) => { statusBox.textContent = "Could not attach Genesis: " + error.message; }
    );
  </script>
</body>
</html>
