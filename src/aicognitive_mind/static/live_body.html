<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Cognitive Mind — Live Body</title>
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; font-family: system-ui, sans-serif; background: #101114; color: #f2f2f2; }
    main { max-width: 1100px; margin: 0 auto; padding: 1.25rem; }
    #stage {
      width: 100%;
      height: clamp(320px, 48vh, 520px);
      background: #181a20;
      border-radius: 14px;
      overflow: hidden;
    }
    @media (max-width: 700px) {
      #stage { height: clamp(280px, 44vh, 420px); }
    }
    #stage canvas { display: block; width: 100%; height: 100%; }
    .controls { display: flex; flex-wrap: wrap; gap: .75rem; margin: 1rem 0; }
    button { padding: .7rem 1rem; font: inherit; cursor: pointer; }
    button:disabled { cursor: not-allowed; opacity: .5; }
    video { width: 220px; border-radius: 10px; background: #181a20; }
    #cameraPanel { display: flex; gap: 1rem; align-items: center; flex-wrap: wrap; }
    #status { white-space: pre-wrap; background: #181a20; padding: 1rem; border-radius: 10px; margin-top: 1rem; min-height: 6rem; }
    #evidenceArtifact { display: inline-block; margin-top: .75rem; }
    .interaction-panel { margin: 1rem 0; padding: 1rem; background: #181a20; border-radius: 14px; }
    .interaction-form { display: grid; gap: .75rem; }
    .interaction-form textarea {
      width: 100%;
      box-sizing: border-box;
      min-height: 6rem;
      resize: vertical;
      padding: .8rem;
      border: 1px solid #373a44;
      border-radius: 10px;
      background: #101114;
      color: #f2f2f2;
      font: inherit;
    }
    #interactionResponse {
      white-space: pre-wrap;
      min-height: 1.5rem;
      color: #d7d9df;
    }
  </style>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/",
        "@pixiv/three-vrm": "https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@3.5.5/lib/three-vrm.module.min.js"
      }
    }
  </script>
</head>
<body>
  <main>
    <div id="stage"></div>

    <section class="interaction-panel" aria-label="Text interaction">
      <form id="interactionForm" class="interaction-form">
        <label for="interactionMessage">Message</label>
        <textarea id="interactionMessage" maxlength="8000" placeholder="Talk to the Mind..." required></textarea>
        <div class="controls">
          <button id="sendInteraction" type="submit">Send interaction</button>
          <button id="clearInteraction" type="button">Clear</button>
        </div>
      </form>
      <div id="interactionResponse" aria-live="polite"></div>
    </section>

    <div id="cameraPanel">
      <video id="video" autoplay playsinline muted></video>
      <div>
        <div class="controls">
          <button id="see">See through camera</button>
          <button id="listen">Listen for 5 seconds</button>
          <button id="stopListen" disabled>Stop listening</button>
        </div>
        <div class="controls">
          <button id="stopCamera" disabled>Release camera</button>
          <button id="stopSpeech">Stop speech</button>
        </div>
      </div>
    </div>

    <canvas id="captureCanvas" hidden></canvas>
    <div id="status">Attaching Genesis...</div>
    <a id="evidenceArtifact" href="#" target="_blank" rel="noopener" hidden>Open evidence artifact</a>
  </main>

  <script type="module">
    import * as THREE from "three";
    import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";
    import { VRMLoaderPlugin, VRMUtils } from "@pixiv/three-vrm";
    import {
      AvatarCustomizer,
      loadSavedAvatarAppearance
    } from "/static/avatar_customizer.js";

    const stage = document.getElementById("stage");
    const video = document.getElementById("video");
    const canvas = document.getElementById("captureCanvas");
    const seeButton = document.getElementById("see");
    const listenButton = document.getElementById("listen");
    const stopListenButton = document.getElementById("stopListen");
    const stopCameraButton = document.getElementById("stopCamera");
    const stopSpeechButton = document.getElementById("stopSpeech");
    const statusBox = document.getElementById("status");
    const evidenceArtifactLink = document.getElementById("evidenceArtifact");
    const interactionForm = document.getElementById("interactionForm");
    const interactionMessage = document.getElementById("interactionMessage");
    const sendInteractionButton = document.getElementById("sendInteraction");
    const clearInteractionButton = document.getElementById("clearInteraction");
    const interactionResponse = document.getElementById("interactionResponse");

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    stage.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(30, 1, 0.1, 50);
    camera.position.set(0, 1.15, 4.0);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 1.05, 0);
    controls.enableDamping = true;

    scene.add(new THREE.HemisphereLight(0xffffff, 0x333333, 2.0));
    const keyLight = new THREE.DirectionalLight(0xffffff, 2.4);
    keyLight.position.set(1.5, 2.5, 2.0);
    scene.add(keyLight);

    const loader = new GLTFLoader();
    loader.register((parser) => new VRMLoaderPlugin(parser));

    const clock = new THREE.Clock();
    let currentVrm = null;
    let avatarCustomizer = null;
    let cameraStream = null;
    let microphoneStream = null;
    let recorder = null;
    let audioChunks = [];
    let audioStartedAt = 0;
    let listenTimer = null;
    let voices = [];

    function setStatus(message) {
      statusBox.textContent = message;
    }

    function resize() {
      const width = stage.clientWidth;
      const height = stage.clientHeight;
      renderer.setSize(width, height, false);
      camera.aspect = width / height;
      camera.updateProjectionMatrix();
    }

    function loadVoices() {
      voices = window.speechSynthesis?.getVoices?.() || [];
    }

    function frameAvatar(object, padding = 1.22) {
      const box = new THREE.Box3().setFromObject(object);
      if (box.isEmpty()) return;

      const size = box.getSize(new THREE.Vector3());
      const center = box.getCenter(new THREE.Vector3());
      const aspect = Math.max(0.25, camera.aspect || 1);
      const verticalFov = THREE.MathUtils.degToRad(camera.fov);
      const horizontalFov = 2 * Math.atan(Math.tan(verticalFov / 2) * aspect);

      const distanceForHeight =
        (size.y * padding) / (2 * Math.tan(verticalFov / 2));
      const distanceForWidth =
        (size.x * padding) / (2 * Math.tan(horizontalFov / 2));
      const distance = Math.max(distanceForHeight, distanceForWidth, 1.5);

      camera.position.set(center.x, center.y, center.z + distance);
      camera.near = Math.max(0.01, distance / 100);
      camera.far = Math.max(50, distance * 20);
      camera.updateProjectionMatrix();

      controls.target.copy(center);
      controls.update();
    }

    function attachAvatar(gltf) {
      const vrm = gltf.userData.vrm;
      if (!vrm) {
        setStatus("Genesis did not load as a VRM avatar.");
        return;
      }
      VRMUtils.removeUnnecessaryVertices(gltf.scene);
      VRMUtils.combineSkeletons(gltf.scene);
      VRMUtils.combineMorphs(vrm);
      VRMUtils.rotateVRM0(vrm);
      vrm.scene.traverse((object) => { object.frustumCulled = false; });
      currentVrm = vrm;
      scene.add(vrm.scene);
      frameAvatar(vrm.scene);
      avatarCustomizer = new AvatarCustomizer(vrm);
      avatarCustomizer.apply(loadSavedAvatarAppearance());
      setStatus("LIVE BODY READY\nGenesis attached. Eyes, Ears, Face, and Mouth are connected.");
    }

    function applyFaceIntent(intent) {
      if (!currentVrm?.expressionManager || !intent) return;
      const manager = currentVrm.expressionManager;
      const expression = String(intent.metadata?.expression || "neutral");
      const weight = Number(intent.metadata?.weight ?? 1.0);
      manager.resetValues();
      if (manager.getExpression(expression)) {
        manager.setValue(expression, Math.max(0, Math.min(1, weight)));
      }
      manager.update();
    }

    function speakIntent(intent) {
      if (!intent?.text || !window.speechSynthesis) return;
      loadVoices();
      const metadata = intent.metadata || {};
      const utterance = new SpeechSynthesisUtterance(intent.text);
      utterance.rate = Number(metadata.rate ?? 1);
      utterance.pitch = Number(metadata.pitch ?? 1);
      utterance.volume = Number(metadata.volume ?? 1);
      if (metadata.voice_name) {
        const voice = voices.find((item) => item.name === metadata.voice_name);
        if (voice) utterance.voice = voice;
      }
      window.speechSynthesis.cancel();
      window.speechSynthesis.speak(utterance);
    }

    async function consumeExpressionOutputs() {
      const [faceResponse, mouthResponse] = await Promise.all([
        fetch("/v1/body/face/next", { cache: "no-store" }),
        fetch("/v1/body/mouth/next", { cache: "no-store" })
      ]);

      if (faceResponse.ok) {
        const faceIntent = await faceResponse.json();
        if (faceIntent) applyFaceIntent(faceIntent);
      }
      if (mouthResponse.ok) {
        const mouthIntent = await mouthResponse.json();
        if (mouthIntent) speakIntent(mouthIntent);
      }
    }

    async function showMindResult(result) {
      const evidence = result.evidence;
      const evidenceUrl =
        "/v1/evidence/" + encodeURIComponent(evidence.sha256) +
        "?captured_at=" + encodeURIComponent(evidence.captured_at);

      evidenceArtifactLink.href = evidenceUrl;
      evidenceArtifactLink.textContent =
        evidence.modality === "audio"
          ? "Open preserved audio evidence"
          : "Open preserved visual evidence";
      evidenceArtifactLink.hidden = false;

      setStatus(
        "MIND ↔ BODY LOOP COMPLETE\n\n" +
        "Evidence:\n" +
        evidence.media_type + "\n" +
        "sha256: " + evidence.sha256 + "\n" +
        "captured: " + evidence.captured_at + "\n\n" +
        "Perception:\n" + result.interpretation + "\n\n" +
        "Mind response:\n" + result.response_text
      );
      await consumeExpressionOutputs();
    }

    async function responseErrorMessage(response) {
      const text = await response.text();
      try {
        const payload = JSON.parse(text);
        return payload.detail || text || ("HTTP " + response.status);
      } catch {
        return text || ("HTTP " + response.status);
      }
    }

    async function submitTextInteraction(event) {
      event.preventDefault();
      const message = interactionMessage.value.trim();
      if (!message) return;

      sendInteractionButton.disabled = true;
      interactionResponse.textContent = "Thinking...";
      evidenceArtifactLink.hidden = true;

      try {
        const response = await fetch("/v1/mind/body/interact", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message })
        });
        if (!response.ok) throw new Error(await responseErrorMessage(response));

        const result = await response.json();
        interactionResponse.textContent = result.response_text;
        setStatus(
          "TEXT INTERACTION COMPLETE\n\n" +
          "You:\n" + message + "\n\n" +
          "Mind response:\n" + result.response_text
        );
        interactionMessage.value = "";
        await consumeExpressionOutputs();
      } catch (error) {
        interactionResponse.textContent = "Interaction failed: " + error.message;
        setStatus("Text interaction failed: " + error.message);
      } finally {
        sendInteractionButton.disabled = false;
        interactionMessage.focus();
      }
    }

    async function ensureCamera() {
      if (cameraStream) return;
      cameraStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
      video.srcObject = cameraStream;
      await video.play();
      stopCameraButton.disabled = false;
    }

    function releaseCamera() {
      if (cameraStream) {
        for (const track of cameraStream.getTracks()) track.stop();
        cameraStream = null;
      }
      video.srcObject = null;
      stopCameraButton.disabled = true;
    }

    async function seeThroughBody() {
      try {
        if (!navigator.mediaDevices?.getUserMedia) {
          setStatus("This browser does not expose camera access.");
          return;
        }
        await ensureCamera();

        const maxWidth = 960;
        const scale = Math.min(1, maxWidth / video.videoWidth);
        canvas.width = Math.max(1, Math.round(video.videoWidth * scale));
        canvas.height = Math.max(1, Math.round(video.videoHeight * scale));
        canvas.getContext("2d").drawImage(video, 0, 0, canvas.width, canvas.height);

        evidenceArtifactLink.hidden = true;
        setStatus("Eyes captured a frame. Preserving evidence and sending sensation to the Mind...");

        const ingress = await fetch("/v1/body/eyes/observe", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            image_data_url: canvas.toDataURL("image/jpeg", 0.85),
            width: canvas.width,
            height: canvas.height,
            source: "browser-camera"
          })
        });
        if (!ingress.ok) throw new Error(await ingress.text());

        const response = await fetch("/v1/mind/body/see", { method: "POST" });
        if (!response.ok) throw new Error(await responseErrorMessage(response));
        await showMindResult(await response.json());
      } catch (error) {
        setStatus("Visual Mind↔Body loop failed: " + error.message);
      }
    }

    function preferredAudioMimeType() {
      const candidates = [
        "audio/webm;codecs=opus",
        "audio/webm",
        "audio/ogg;codecs=opus"
      ];
      return candidates.find((type) => MediaRecorder.isTypeSupported(type)) || "";
    }

    function blobToDataUrl(blob) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = () => reject(reader.error);
        reader.readAsDataURL(blob);
      });
    }

    function releaseMicrophone() {
      if (microphoneStream) {
        for (const track of microphoneStream.getTracks()) track.stop();
        microphoneStream = null;
      }
      if (listenTimer) {
        clearTimeout(listenTimer);
        listenTimer = null;
      }
      listenButton.disabled = false;
      stopListenButton.disabled = true;
    }

    async function submitAudio(blob, durationMs) {
      evidenceArtifactLink.hidden = true;
      setStatus("Ears captured sound. Preserving evidence and sending sensation to the Mind...");
      const ingress = await fetch("/v1/body/ears/observe", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          audio_data_url: await blobToDataUrl(blob),
          duration_ms: durationMs,
          source: "browser-microphone"
        })
      });
      if (!ingress.ok) throw new Error(await ingress.text());

      const response = await fetch("/v1/mind/body/hear", { method: "POST" });
      if (!response.ok) throw new Error(await responseErrorMessage(response));
      await showMindResult(await response.json());
    }

    async function listenThroughBody() {
      if (!navigator.mediaDevices?.getUserMedia || !window.MediaRecorder) {
        setStatus("This browser does not expose microphone recording.");
        return;
      }

      try {
        microphoneStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
        const mimeType = preferredAudioMimeType();
        recorder = mimeType
          ? new MediaRecorder(microphoneStream, { mimeType })
          : new MediaRecorder(microphoneStream);

        audioChunks = [];
        recorder.addEventListener("dataavailable", (event) => {
          if (event.data.size > 0) audioChunks.push(event.data);
        });
        recorder.addEventListener("stop", async () => {
          const durationMs = Math.max(1, Math.min(30_000, Math.round(performance.now() - audioStartedAt)));
          const blob = new Blob(
            audioChunks,
            { type: recorder.mimeType || audioChunks[0]?.type || "audio/webm" }
          );
          releaseMicrophone();
          try {
            await submitAudio(blob, durationMs);
          } catch (error) {
            setStatus("Auditory Mind↔Body loop failed: " + error.message);
          }
        }, { once: true });

        recorder.start();
        audioStartedAt = performance.now();
        listenButton.disabled = true;
        stopListenButton.disabled = false;
        setStatus("LISTENING\nSpeak now. The clip will stop after 5 seconds.");
        listenTimer = setTimeout(() => {
          if (recorder?.state === "recording") recorder.stop();
        }, 5_000);
      } catch (error) {
        releaseMicrophone();
        setStatus("Microphone access failed: " + error.message);
      }
    }

    function stopListening() {
      if (recorder?.state === "recording") recorder.stop();
    }

    function animate() {
      requestAnimationFrame(animate);
      const delta = clock.getDelta();
      if (currentVrm) currentVrm.update(delta);
      controls.update();
      renderer.render(scene, camera);
    }

    interactionForm.addEventListener("submit", submitTextInteraction);
    clearInteractionButton.addEventListener("click", () => {
      interactionMessage.value = "";
      interactionResponse.textContent = "";
      interactionMessage.focus();
    });

    seeButton.addEventListener("click", seeThroughBody);
    listenButton.addEventListener("click", listenThroughBody);
    stopListenButton.addEventListener("click", stopListening);
    stopCameraButton.addEventListener("click", releaseCamera);
    stopSpeechButton.addEventListener("click", () => window.speechSynthesis?.cancel());

    if (window.speechSynthesis) {
      loadVoices();
      window.speechSynthesis.onvoiceschanged = loadVoices;
    }

    window.addEventListener("resize", resize);
    window.addEventListener("beforeunload", () => {
      releaseCamera();
      releaseMicrophone();
      window.speechSynthesis?.cancel();
    });

    resize();
    animate();
    loader.load(
      "/v1/body/face/avatar",
      attachAvatar,
      undefined,
      (error) => setStatus("Could not attach Genesis: " + error.message)
    );
  </script>
</body>
</html>
