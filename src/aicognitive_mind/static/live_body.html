<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Cognitive Mind — Live Body</title>
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; font-family: system-ui, sans-serif; background: #101114; color: #f2f2f2; }
    main { max-width: 1100px; margin: 0 auto; padding: 1.25rem; }
    .page-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: .75rem;
      margin-bottom: .85rem;
    }
    .page-links { display: flex; gap: .6rem; flex-wrap: wrap; }
    .page-links a {
      display: inline-flex;
      align-items: center;
      min-height: 2.35rem;
      padding: .5rem .72rem;
      border: 1px solid #373a44;
      border-radius: 9px;
      background: #181a20;
      color: #d7d9df;
      text-decoration: none;
      font-size: .92rem;
    }
    .page-links a:hover { border-color: #687388; }
    #stage {
      width: 100%;
      height: clamp(320px, 48vh, 520px);
      background: #181a20;
      border-radius: 14px;
      overflow: hidden;
    }
    @media (max-width: 700px) {
      #stage { height: clamp(280px, 44vh, 420px); }
    }
    #stage canvas { display: block; width: 100%; height: 100%; }
    button { padding: .7rem 1rem; font: inherit; cursor: pointer; }
    button:disabled { cursor: not-allowed; opacity: .5; }
    #status { white-space: pre-wrap; background: #181a20; padding: 1rem; border-radius: 10px; margin-top: 1rem; min-height: 6rem; }
    #evidenceArtifact { display: inline-block; margin-top: .75rem; }
    .interaction-panel {
      margin: 1rem 0;
      background: #181a20;
      border: 1px solid #242731;
      border-radius: 16px;
      overflow: hidden;
    }
    #interactionHistory {
      min-height: 8rem;
      max-height: 34vh;
      overflow-y: auto;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: .75rem;
    }
    .chat-empty {
      margin: auto;
      color: #858a96;
      text-align: center;
      font-size: .95rem;
    }
    .chat-message {
      max-width: 82%;
      padding: .72rem .9rem;
      border-radius: 14px;
      white-space: pre-wrap;
      line-height: 1.4;
    }
    .chat-message.user {
      align-self: flex-end;
      background: #2b5f91;
      color: #fff;
      border-bottom-right-radius: 5px;
    }
    .chat-message.mind {
      align-self: flex-start;
      background: #242731;
      color: #eceef3;
      border-bottom-left-radius: 5px;
    }
    .chat-message.error {
      align-self: flex-start;
      background: #3a2528;
      color: #ffd7da;
    }
    .interaction-form {
      display: flex;
      gap: .65rem;
      align-items: flex-end;
      padding: .8rem;
      border-top: 1px solid #2a2d36;
      background: #14161b;
    }
    .interaction-form textarea {
      flex: 1;
      width: 100%;
      box-sizing: border-box;
      min-height: 2.8rem;
      max-height: 9rem;
      resize: none;
      padding: .72rem .82rem;
      border: 1px solid #373a44;
      border-radius: 12px;
      background: #101114;
      color: #f2f2f2;
      font: inherit;
      line-height: 1.35;
    }
    .interaction-form textarea:focus {
      outline: none;
      border-color: #687388;
      box-shadow: 0 0 0 2px rgba(104, 115, 136, .2);
    }
    .interaction-actions {
      display: flex;
      gap: .5rem;
      align-items: center;
    }
    .interaction-actions button { margin: 0; }
    #clearInteraction {
      background: transparent;
      color: #b6bbc7;
      border: 1px solid #373a44;
    }
    #sendInteraction {
      border: 1px solid #4777a7;
      background: #315f8d;
      color: #fff;
    }
    .sense-panel {
      margin-top: 1rem;
      padding: .8rem 1rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      background: #181a20;
      border-radius: 14px;
    }
    .sense-label {
      color: #c8ccd5;
      font-weight: 650;
    }
    .senses-toggle {
      min-width: 118px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: .55rem;
      border: 1px solid #454954;
      border-radius: 999px;
      background: #242731;
      color: #c8ccd5;
    }
    .senses-toggle::before {
      content: "";
      width: .72rem;
      height: .72rem;
      border-radius: 50%;
      background: #676d78;
      box-shadow: 0 0 0 3px rgba(103, 109, 120, .12);
    }
    .senses-toggle.on {
      border-color: #38795d;
      background: #1d382d;
      color: #d9f6e8;
    }
    .senses-toggle.on::before {
      background: #65d39b;
      box-shadow: 0 0 0 3px rgba(101, 211, 155, .14);
    }
  </style>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/",
        "@pixiv/three-vrm": "https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@3.5.5/lib/three-vrm.module.min.js"
      }
    }
  </script>
</head>
<body>
  <main>
    <nav class="page-bar" aria-label="Body navigation">
      <div class="page-links">
        <a href="/" aria-label="Back to portal">← Portal</a>
      </div>
      <div class="page-links">
        <a href="/body/avatar">Avatar Editor</a>
      </div>
    </nav>

    <div id="stage"></div>

    <section class="interaction-panel" aria-label="Conversation with Mind">
      <div id="interactionHistory" aria-live="polite">
        <div id="chatEmpty" class="chat-empty">Talk to the Mind.</div>
      </div>
      <form id="interactionForm" class="interaction-form">
        <textarea
          id="interactionMessage"
          maxlength="8000"
          placeholder="Message the Mind..."
          aria-label="Message"
          rows="1"
          required
        ></textarea>
        <div class="interaction-actions">
          <button id="clearInteraction" type="button" title="Clear conversation">Clear</button>
          <button id="sendInteraction" type="submit" aria-label="Send interaction">Send</button>
        </div>
      </form>
    </section>

    <section class="sense-panel" aria-label="Senses">
      <span class="sense-label">Senses</span>
      <button
        id="sensesToggle"
        class="senses-toggle"
        type="button"
        aria-pressed="false"
      >Off</button>
    </section>

    <video id="video" autoplay playsinline muted hidden></video>
    <canvas id="captureCanvas" hidden></canvas>
    <div id="status">Attaching Genesis...</div>
    <a id="evidenceArtifact" href="#" target="_blank" rel="noopener" hidden>Open evidence artifact</a>
  </main>

  <script type="module">
    import * as THREE from "three";
    import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";
    import { VRMLoaderPlugin, VRMUtils } from "@pixiv/three-vrm";
    import {
      AvatarCustomizer,
      loadSavedAvatarAppearance
    } from "/static/avatar_customizer.js";

    const stage = document.getElementById("stage");
    const video = document.getElementById("video");
    const canvas = document.getElementById("captureCanvas");
    const sensesToggle = document.getElementById("sensesToggle");
    const statusBox = document.getElementById("status");
    const evidenceArtifactLink = document.getElementById("evidenceArtifact");
    const interactionForm = document.getElementById("interactionForm");
    const interactionMessage = document.getElementById("interactionMessage");
    const sendInteractionButton = document.getElementById("sendInteraction");
    const clearInteractionButton = document.getElementById("clearInteraction");
    const interactionHistory = document.getElementById("interactionHistory");
    const chatEmpty = document.getElementById("chatEmpty");

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    stage.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(30, 1, 0.1, 50);
    camera.position.set(0, 1.15, 4.0);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 1.05, 0);
    controls.enableDamping = true;

    scene.add(new THREE.HemisphereLight(0xffffff, 0x333333, 2.0));
    const keyLight = new THREE.DirectionalLight(0xffffff, 2.4);
    keyLight.position.set(1.5, 2.5, 2.0);
    scene.add(keyLight);

    const loader = new GLTFLoader();
    loader.register((parser) => new VRMLoaderPlugin(parser));

    const clock = new THREE.Clock();
    let currentVrm = null;
    let avatarCustomizer = null;
    let cameraStream = null;
    let microphoneStream = null;
    let recorder = null;
    let voices = [];
    let sensesEnabled = false;
    let sensoryLoopGeneration = 0;
    let sensoryRequestInFlight = false;
    const AUDIO_WINDOW_MS = 4_000;
    const SENSE_PAUSE_MS = 15_000;
    let pageSourceSnapshot = null;
    let pageRefreshPending = false;
    let pageRefreshProbeBusy = false;

    function setStatus(message) {
      statusBox.textContent = message;
    }

    function bodyIsBusy() {
      return Boolean(
        recorder?.state === "recording" ||
        sensoryRequestInFlight ||
        sendInteractionButton.disabled
      );
    }

    async function checkForBodyPageUpdate() {
      if (document.hidden || pageRefreshProbeBusy) return;
      pageRefreshProbeBusy = true;
      try {
        const response = await fetch(
          window.location.pathname + "?body_refresh_probe=" + Date.now(),
          { cache: "no-store" }
        );
        if (!response.ok) return;
        const source = await response.text();

        if (pageSourceSnapshot === null) {
          pageSourceSnapshot = source;
          return;
        }

        if (source !== pageSourceSnapshot) {
          pageRefreshPending = true;
        }

        if (pageRefreshPending && !bodyIsBusy()) {
          window.location.reload();
        }
      } catch {
        // A failed probe should never interrupt the active Body session.
      } finally {
        pageRefreshProbeBusy = false;
      }
    }

    function resize() {
      const width = stage.clientWidth;
      const height = stage.clientHeight;
      renderer.setSize(width, height, false);
      camera.aspect = width / height;
      camera.updateProjectionMatrix();
    }

    function loadVoices() {
      voices = window.speechSynthesis?.getVoices?.() || [];
    }

    function frameAvatar(object, padding = 1.22) {
      const box = new THREE.Box3().setFromObject(object);
      if (box.isEmpty()) return;

      const size = box.getSize(new THREE.Vector3());
      const center = box.getCenter(new THREE.Vector3());
      const aspect = Math.max(0.25, camera.aspect || 1);
      const verticalFov = THREE.MathUtils.degToRad(camera.fov);
      const horizontalFov = 2 * Math.atan(Math.tan(verticalFov / 2) * aspect);

      const distanceForHeight =
        (size.y * padding) / (2 * Math.tan(verticalFov / 2));
      const distanceForWidth =
        (size.x * padding) / (2 * Math.tan(horizontalFov / 2));
      const distance = Math.max(distanceForHeight, distanceForWidth, 1.5);

      camera.position.set(center.x, center.y, center.z + distance);
      camera.near = Math.max(0.01, distance / 100);
      camera.far = Math.max(50, distance * 20);
      camera.updateProjectionMatrix();

      controls.target.copy(center);
      controls.update();
    }

    function attachAvatar(gltf) {
      const vrm = gltf.userData.vrm;
      if (!vrm) {
        setStatus("Genesis did not load as a VRM avatar.");
        return;
      }
      VRMUtils.removeUnnecessaryVertices(gltf.scene);
      VRMUtils.combineSkeletons(gltf.scene);
      VRMUtils.combineMorphs(vrm);
      VRMUtils.rotateVRM0(vrm);
      vrm.scene.traverse((object) => { object.frustumCulled = false; });
      currentVrm = vrm;
      scene.add(vrm.scene);
      frameAvatar(vrm.scene);
      avatarCustomizer = new AvatarCustomizer(vrm);
      avatarCustomizer.apply(loadSavedAvatarAppearance());
      setStatus("LIVE BODY READY\nGenesis attached. Eyes, Ears, Face, and Mouth are connected.");
    }

    function applyFaceIntent(intent) {
      if (!currentVrm?.expressionManager || !intent) return;
      const manager = currentVrm.expressionManager;
      const expression = String(intent.metadata?.expression || "neutral");
      const weight = Number(intent.metadata?.weight ?? 1.0);
      manager.resetValues();
      if (manager.getExpression(expression)) {
        manager.setValue(expression, Math.max(0, Math.min(1, weight)));
      }
      manager.update();
    }

    function speakIntent(intent) {
      if (!intent?.text || !window.speechSynthesis) return;
      loadVoices();
      const metadata = intent.metadata || {};
      const utterance = new SpeechSynthesisUtterance(intent.text);
      utterance.rate = Number(metadata.rate ?? 1);
      utterance.pitch = Number(metadata.pitch ?? 1);
      utterance.volume = Number(metadata.volume ?? 1);
      if (metadata.voice_name) {
        const voice = voices.find((item) => item.name === metadata.voice_name);
        if (voice) utterance.voice = voice;
      }
      window.speechSynthesis.cancel();
      window.speechSynthesis.speak(utterance);
    }

    async function consumeExpressionOutputs() {
      const [faceResponse, mouthResponse] = await Promise.all([
        fetch("/v1/body/face/next", { cache: "no-store" }),
        fetch("/v1/body/mouth/next", { cache: "no-store" })
      ]);

      if (faceResponse.ok) {
        const faceIntent = await faceResponse.json();
        if (faceIntent) applyFaceIntent(faceIntent);
      }
      if (mouthResponse.ok) {
        const mouthIntent = await mouthResponse.json();
        if (mouthIntent) speakIntent(mouthIntent);
      }
    }

    async function showMindResult(result, { consumeOutputs = true } = {}) {
      const evidence = result.evidence;
      const evidenceUrl =
        "/v1/evidence/" + encodeURIComponent(evidence.sha256) +
        "?captured_at=" + encodeURIComponent(evidence.captured_at);

      evidenceArtifactLink.href = evidenceUrl;
      evidenceArtifactLink.textContent =
        evidence.modality === "audio"
          ? "Open preserved audio evidence"
          : "Open preserved visual evidence";
      evidenceArtifactLink.hidden = false;

      setStatus(
        "MIND ↔ BODY LOOP COMPLETE\n\n" +
        "Evidence:\n" +
        evidence.media_type + "\n" +
        "sha256: " + evidence.sha256 + "\n" +
        "captured: " + evidence.captured_at + "\n\n" +
        "Perception:\n" + result.interpretation + "\n\n" +
        "Mind response:\n" + result.response_text
      );
      if (consumeOutputs) {
        await consumeExpressionOutputs();
      }
    }

    async function responseErrorMessage(response) {
      const text = await response.text();
      try {
        const payload = JSON.parse(text);
        return payload.detail || text || ("HTTP " + response.status);
      } catch {
        return text || ("HTTP " + response.status);
      }
    }

    function appendChatMessage(role, text, extraClass = "") {
      chatEmpty?.remove();
      const message = document.createElement("div");
      message.className = "chat-message " + role + (extraClass ? " " + extraClass : "");
      message.textContent = text;
      interactionHistory.appendChild(message);
      interactionHistory.scrollTop = interactionHistory.scrollHeight;
      return message;
    }

    function resizeComposer() {
      interactionMessage.style.height = "auto";
      interactionMessage.style.height =
        Math.min(interactionMessage.scrollHeight, 144) + "px";
    }

    async function submitTextInteraction(event) {
      event.preventDefault();
      const message = interactionMessage.value.trim();
      if (!message) return;

      appendChatMessage("user", message);
      interactionMessage.value = "";
      resizeComposer();

      sendInteractionButton.disabled = true;
      const thinkingMessage = appendChatMessage("mind", "Thinking...");
      evidenceArtifactLink.hidden = true;

      try {
        const response = await fetch("/v1/mind/body/interact", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message })
        });
        if (!response.ok) throw new Error(await responseErrorMessage(response));

        const result = await response.json();
        thinkingMessage.textContent = result.response_text;
        setStatus(
          "TEXT INTERACTION COMPLETE\n\n" +
          "You:\n" + message + "\n\n" +
          "Mind response:\n" + result.response_text
        );
        interactionHistory.scrollTop = interactionHistory.scrollHeight;
        await consumeExpressionOutputs();
      } catch (error) {
        thinkingMessage.classList.add("error");
        thinkingMessage.textContent = "Interaction failed: " + error.message;
        setStatus("Text interaction failed: " + error.message);
      } finally {
        sendInteractionButton.disabled = false;
        interactionMessage.focus();
      }
    }

    function delay(ms) {
      return new Promise((resolve) => window.setTimeout(resolve, ms));
    }

    function preferredAudioMimeType() {
      const candidates = [
        "audio/webm;codecs=opus",
        "audio/webm",
        "audio/ogg;codecs=opus"
      ];
      return candidates.find((type) => MediaRecorder.isTypeSupported(type)) || "";
    }

    function blobToDataUrl(blob) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = () => reject(reader.error);
        reader.readAsDataURL(blob);
      });
    }

    async function perceiveVision(generation) {
      if (
        !sensesEnabled ||
        generation !== sensoryLoopGeneration ||
        !cameraStream ||
        video.readyState < 2 ||
        !video.videoWidth ||
        !video.videoHeight
      ) {
        return;
      }

      const maxWidth = 960;
      const scale = Math.min(1, maxWidth / video.videoWidth);
      canvas.width = Math.max(1, Math.round(video.videoWidth * scale));
      canvas.height = Math.max(1, Math.round(video.videoHeight * scale));
      canvas.getContext("2d").drawImage(video, 0, 0, canvas.width, canvas.height);

      sensoryRequestInFlight = true;
      try {
        setStatus("SENSES ON\nSeeing...");
        const ingress = await fetch("/v1/body/eyes/observe", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            image_data_url: canvas.toDataURL("image/jpeg", 0.82),
            width: canvas.width,
            height: canvas.height,
            source: "browser-camera"
          })
        });
        if (!ingress.ok) throw new Error(await responseErrorMessage(ingress));
        if (!sensesEnabled || generation !== sensoryLoopGeneration) return;

        const response = await fetch(
          "/v1/mind/body/see?express=false",
          { method: "POST" }
        );
        if (!response.ok) throw new Error(await responseErrorMessage(response));
        if (!sensesEnabled || generation !== sensoryLoopGeneration) return;

        await showMindResult(await response.json(), { consumeOutputs: false });
      } finally {
        sensoryRequestInFlight = false;
      }
    }

    function recordAudioWindow(generation) {
      if (
        !sensesEnabled ||
        generation !== sensoryLoopGeneration ||
        !microphoneStream ||
        !window.MediaRecorder
      ) {
        return Promise.resolve(null);
      }

      return new Promise((resolve, reject) => {
        const mimeType = preferredAudioMimeType();
        const activeRecorder = mimeType
          ? new MediaRecorder(microphoneStream, { mimeType })
          : new MediaRecorder(microphoneStream);
        const chunks = [];
        const startedAt = performance.now();
        let stopTimer = null;

        recorder = activeRecorder;
        activeRecorder.addEventListener("dataavailable", (event) => {
          if (event.data.size > 0) chunks.push(event.data);
        });
        activeRecorder.addEventListener("error", (event) => {
          if (stopTimer) clearTimeout(stopTimer);
          if (recorder === activeRecorder) recorder = null;
          reject(event.error || new Error("Microphone recording failed"));
        }, { once: true });
        activeRecorder.addEventListener("stop", () => {
          if (stopTimer) clearTimeout(stopTimer);
          if (recorder === activeRecorder) recorder = null;

          if (
            !sensesEnabled ||
            generation !== sensoryLoopGeneration ||
            chunks.length === 0
          ) {
            resolve(null);
            return;
          }

          const durationMs = Math.max(
            1,
            Math.min(30_000, Math.round(performance.now() - startedAt))
          );
          resolve({
            blob: new Blob(
              chunks,
              { type: activeRecorder.mimeType || chunks[0]?.type || "audio/webm" }
            ),
            durationMs
          });
        }, { once: true });

        activeRecorder.start();
        stopTimer = window.setTimeout(() => {
          if (activeRecorder.state === "recording") activeRecorder.stop();
        }, AUDIO_WINDOW_MS);
      });
    }

    async function perceiveAudio(generation) {
      if (window.speechSynthesis?.speaking) return;

      setStatus("SENSES ON\nListening...");
      const recording = await recordAudioWindow(generation);
      if (
        !recording ||
        !sensesEnabled ||
        generation !== sensoryLoopGeneration
      ) {
        return;
      }

      sensoryRequestInFlight = true;
      try {
        const ingress = await fetch("/v1/body/ears/observe", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            audio_data_url: await blobToDataUrl(recording.blob),
            duration_ms: recording.durationMs,
            source: "browser-microphone"
          })
        });
        if (!ingress.ok) throw new Error(await responseErrorMessage(ingress));
        if (!sensesEnabled || generation !== sensoryLoopGeneration) return;

        const response = await fetch(
          "/v1/mind/body/hear?express=false",
          { method: "POST" }
        );
        if (!response.ok) throw new Error(await responseErrorMessage(response));
        if (!sensesEnabled || generation !== sensoryLoopGeneration) return;

        await showMindResult(await response.json(), { consumeOutputs: false });
      } finally {
        sensoryRequestInFlight = false;
      }
    }

    async function runSensoryLoop(generation) {
      while (sensesEnabled && generation === sensoryLoopGeneration) {
        if (document.hidden || sendInteractionButton.disabled) {
          await delay(1_000);
          continue;
        }

        try {
          await perceiveVision(generation);
        } catch (error) {
          if (sensesEnabled && generation === sensoryLoopGeneration) {
            setStatus("Continuous vision failed: " + error.message);
          }
        }

        if (!sensesEnabled || generation !== sensoryLoopGeneration) break;
        await delay(SENSE_PAUSE_MS);
        if (!sensesEnabled || generation !== sensoryLoopGeneration) break;

        if (document.hidden || sendInteractionButton.disabled) {
          continue;
        }

        try {
          await perceiveAudio(generation);
        } catch (error) {
          if (sensesEnabled && generation === sensoryLoopGeneration) {
            setStatus("Continuous hearing failed: " + error.message);
          }
        }

        if (!sensesEnabled || generation !== sensoryLoopGeneration) break;
        await delay(SENSE_PAUSE_MS);
      }
    }

    function startSensoryLoop() {
      const generation = ++sensoryLoopGeneration;
      runSensoryLoop(generation);
    }

    function setSensesUi(enabled) {
      sensesEnabled = enabled;
      sensesToggle.classList.toggle("on", enabled);
      sensesToggle.setAttribute("aria-pressed", String(enabled));
      sensesToggle.textContent = enabled ? "On" : "Off";
    }

    async function enableSenses() {
      if (!navigator.mediaDevices?.getUserMedia) {
        setStatus("This browser does not expose camera and microphone access.");
        setSensesUi(false);
        return;
      }

      sensesToggle.disabled = true;
      try {
        const [videoStream, audioStream] = await Promise.all([
          navigator.mediaDevices.getUserMedia({ video: true, audio: false }),
          navigator.mediaDevices.getUserMedia({ audio: true, video: false })
        ]);

        cameraStream = videoStream;
        microphoneStream = audioStream;
        video.srcObject = cameraStream;
        await video.play();

        setSensesUi(true);
        localStorage.setItem("aicognitive_mind.senses", "on");
        setStatus("SENSES ON\nContinuous vision and hearing are active.");
        startSensoryLoop();
      } catch (error) {
        releaseSenses();
        setStatus("Could not turn senses on: " + error.message);
      } finally {
        sensesToggle.disabled = false;
      }
    }

    function releaseSenses({ persist = true } = {}) {
      sensoryLoopGeneration += 1;
      sensoryRequestInFlight = false;
      if (recorder?.state === "recording") {
        recorder.stop();
      }
      recorder = null;

      if (cameraStream) {
        for (const track of cameraStream.getTracks()) track.stop();
        cameraStream = null;
      }
      if (microphoneStream) {
        for (const track of microphoneStream.getTracks()) track.stop();
        microphoneStream = null;
      }

      video.srcObject = null;
      setSensesUi(false);
      if (persist) {
        localStorage.setItem("aicognitive_mind.senses", "off");
      }
    }

    async function toggleSenses() {
      if (sensesEnabled) {
        releaseSenses();
        setStatus("SENSES OFF\nContinuous perception stopped. Camera and microphone have been released.");
        return;
      }
      await enableSenses();
    }

    function animate() {
      requestAnimationFrame(animate);
      const delta = clock.getDelta();
      if (currentVrm) currentVrm.update(delta);
      controls.update();
      renderer.render(scene, camera);
    }

    interactionForm.addEventListener("submit", submitTextInteraction);
    interactionMessage.addEventListener("input", resizeComposer);
    interactionMessage.addEventListener("keydown", (event) => {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        interactionForm.requestSubmit();
      }
    });
    clearInteractionButton.addEventListener("click", () => {
      interactionMessage.value = "";
      interactionHistory.replaceChildren();
      const empty = document.createElement("div");
      empty.id = "chatEmpty";
      empty.className = "chat-empty";
      empty.textContent = "Talk to the Mind.";
      interactionHistory.appendChild(empty);
      resizeComposer();
      interactionMessage.focus();
    });

    sensesToggle.addEventListener("click", toggleSenses);

    if (window.speechSynthesis) {
      loadVoices();
      window.speechSynthesis.onvoiceschanged = loadVoices;
    }

    window.addEventListener("resize", resize);
    document.addEventListener("visibilitychange", () => {
      if (!document.hidden) checkForBodyPageUpdate();
    });
    window.addEventListener("beforeunload", () => {
      releaseSenses({ persist: false });
      window.speechSynthesis?.cancel();
    });

    resize();
    animate();
    checkForBodyPageUpdate();
    window.setInterval(checkForBodyPageUpdate, 12_000);
    if (localStorage.getItem("aicognitive_mind.senses") === "on") {
      enableSenses();
    } else {
      setSensesUi(false);
    }
    loader.load(
      "/v1/body/face/avatar",
      attachAvatar,
      undefined,
      (error) => setStatus("Could not attach Genesis: " + error.message)
    );
  </script>
</body>
</html>
