<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Axiom — Live Body</title>
  <style>
    :root { color-scheme: dark; font-size: calc(100% - 1px); }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body { font-family: system-ui, sans-serif; background: #101114; color: #f2f2f2; }
    main {
      width: 100%;
      height: 100vh;
      height: 100dvh;
      box-sizing: border-box;
      max-width: 1100px;
      margin: 0 auto;
      padding: 1rem 1.25rem;
      display: grid;
      grid-template-rows: auto auto minmax(150px, 34vh) auto minmax(0, auto) minmax(110px, 1fr);
      gap: .7rem;
      overflow: hidden;
      min-height: 0;
    }
    .page-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: .75rem;
      margin-bottom: 0;
    }
    .page-links { display: flex; gap: .6rem; flex-wrap: wrap; }
    .page-links a {
      display: inline-flex;
      align-items: center;
      min-height: 2.35rem;
      padding: .5rem .72rem;
      border: 1px solid #373a44;
      border-radius: 9px;
      background: #181a20;
      color: #d7d9df;
      text-decoration: none;
      font-size: .92rem;
    }
    .page-links a:hover { border-color: #687388; }
    #stage {
      width: 100%;
      height: 100%;
      min-height: 0;
      background: #181a20;
      border-radius: 14px;
      overflow: hidden;
      position: relative;
    }
    #liveScene {
      width: 100%;
      height: 100%;
      object-fit: cover;
      background: #0b0c0f;
      transform: scaleX(-1);
      display: none;
    }
    .audio-meter {
      position: relative;
      left: auto;
      right: auto;
      bottom: auto;
      margin: 0;
      padding: .65rem .8rem;
      border: 1px solid #373a44;
      border-radius: 10px;
      background: rgba(16,17,20,.88);
      display: none;
    }
    .audio-meter-label { display: flex; justify-content: space-between; gap: .5rem; color: #c8ccd5; font-size: .8rem; margin-bottom: .35rem; }
    .audio-meter-track { height: .55rem; border-radius: 999px; background: #2a2d36; overflow: hidden; }
    #audioMeterFill { height: 100%; width: 0%; background: #65d39b; border-radius: inherit; transition: width .08s linear; }
    button { padding: .7rem 1rem; font: inherit; cursor: pointer; }
    button:disabled { cursor: not-allowed; opacity: .5; }
    #status { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
    .sense-status-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: .65rem; margin: 0; max-height: 7.5rem; min-height: 0; overflow-y: auto; overscroll-behavior: contain; }
    .sense-status { min-width: 0; padding: .75rem .85rem; border: 1px solid #373a44; border-radius: 10px; background: #181a20; }
    .sense-status strong { display: block; margin-bottom: .3rem; font-size: .86rem; }
    .sense-status span { display: block; color: #c8ccd5; font-size: .82rem; line-height: 1.4; overflow-wrap: anywhere; white-space: pre-wrap; }
    .sense-status[data-state="success"] { border-color: #38795d; }
    .sense-status[data-state="error"] { border-color: #a34a55; }
    .sense-status[data-state="warning"] { border-color: #8a7040; }
    .host-status {
      max-width: min(58vw, 620px);
      color: #c8ccd5;
      text-align: right;
      overflow-wrap: anywhere;
      font-size: .8rem;
      line-height: 1.35;
    }
    .host-status[data-state="connected"] { color: #9be0bc; }
    .host-status[data-state="disconnected"] { color: #e4c17b; }
    .host-status[data-state="unavailable"] { color: #e7a0a8; }
    @media (max-width: 600px) {
      .host-status { max-width: 64vw; }

      main { padding: .65rem; gap: .5rem; grid-template-rows: auto auto minmax(120px, 27vh) auto minmax(0, auto) minmax(100px, 1fr); }
      .page-bar { margin: 0; }
      .sense-status-grid { grid-template-columns: minmax(0, 1fr); max-height: 5.5rem; }
      .sense-status { padding: .45rem .65rem; }
      .sense-panel { padding: .55rem .75rem; }
      .interaction-form { gap: .4rem; padding: .55rem; }
      .interaction-actions { gap: .35rem; }
      .interaction-actions button { padding: .6rem .7rem; }
    }
    .interaction-panel {
      margin: 0;
      min-height: 0;
      display: flex;
      flex-direction: column;
      background: #181a20;
      border: 1px solid #242731;
      border-radius: 16px;
      overflow: hidden;
    }
    #interactionHistory {
      flex: 1 1 auto;
      min-height: 0;
      max-height: none;
      overflow-y: auto;
      overscroll-behavior: contain;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: .75rem;
    }
    .chat-empty {
      margin: auto;
      color: #858a96;
      text-align: center;
      font-size: calc(.95rem - 1px);
    }
    .chat-message {
      max-width: 82%;
      padding: .72rem .9rem;
      border-radius: 14px;
      white-space: pre-wrap;
      line-height: 1.4;
    }
    .chat-message.user {
      align-self: flex-end;
      background: #2b5f91;
      color: #fff;
      border-bottom-right-radius: 5px;
    }
    .chat-message.mind {
      align-self: flex-start;
      background: #242731;
      color: #eceef3;
      border-bottom-left-radius: 5px;
    }
    .chat-message.error {
      align-self: flex-start;
      background: #3a2528;
      color: #ffd7da;
    }
    .interaction-form {
      display: flex;
      gap: .65rem;
      align-items: flex-end;
      padding: .8rem;
      border-top: 1px solid #2a2d36;
      background: #14161b;
    }
    .interaction-form textarea {
      flex: 1;
      width: 100%;
      box-sizing: border-box;
      min-height: 2.8rem;
      max-height: 9rem;
      resize: none;
      padding: .72rem .82rem;
      border: 1px solid #373a44;
      border-radius: 12px;
      background: #101114;
      color: #f2f2f2;
      font: inherit;
      line-height: 1.35;
    }
    .interaction-form textarea:focus {
      outline: none;
      border-color: #687388;
      box-shadow: 0 0 0 2px rgba(104, 115, 136, .2);
    }
    .interaction-actions {
      display: flex;
      gap: .5rem;
      align-items: center;
    }
    .interaction-actions button { margin: 0; }
    #clearInteraction {
      background: transparent;
      color: #b6bbc7;
      border: 1px solid #373a44;
    }
    #sendInteraction {
      border: 1px solid #4777a7;
      background: #315f8d;
      color: #fff;
    }
    .sense-panel {
      margin-top: 0;
      padding: .8rem 1rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      background: #181a20;
      border-radius: 14px;
    }
    .sense-label {
      color: #c8ccd5;
      font-weight: 650;
    }
    .senses-toggle {
      min-width: 118px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: .55rem;
      border: 1px solid #454954;
      border-radius: 999px;
      background: #242731;
      color: #c8ccd5;
    }
    .senses-toggle::before {
      content: "";
      width: .72rem;
      height: .72rem;
      border-radius: 50%;
      background: #676d78;
      box-shadow: 0 0 0 3px rgba(103, 109, 120, .12);
    }
    .senses-toggle.on {
      border-color: #38795d;
      background: #1d382d;
      color: #d9f6e8;
    }
    .senses-toggle.on::before {
      background: #65d39b;
      box-shadow: 0 0 0 3px rgba(101, 211, 155, .14);
    }
    @media (max-width: 600px) {
      .sense-panel { padding: .55rem .75rem; }
      .interaction-form { gap: .4rem; padding: .55rem; }
      .interaction-actions { gap: .35rem; }
      .interaction-actions button { padding: .6rem .7rem; }
    }
    @media (max-height: 680px) {
      main { padding-top: .5rem; padding-bottom: .5rem; gap: .45rem; }
      #stage { min-height: 110px; }
      .sense-status-grid { max-height: 5rem; }
      .sense-status { padding: .4rem .6rem; }
      .sense-panel { padding-top: .45rem; padding-bottom: .45rem; }
    }
  </style>

</head>
<body>
  <script>
    const bodySessionId = crypto.randomUUID();
    async function bodyFetch(url, options = {}) {
      const headers = new Headers(options.headers || {});
      headers.set("X-Body-Session", bodySessionId);
      const response = await fetch(url, { ...options, headers, signal: options.signal });
      const receipt = response.headers.get("X-Body-Delivery");
      if (response.ok && receipt) {
        await response.clone().arrayBuffer();
        const ack = await fetch(String(url).split("?")[0].replace(/\/next$/, "/ack") + "?delivery_id=" + encodeURIComponent(receipt),
          { method: "POST", headers, signal: AbortSignal.timeout(10000) });
        if (!ack.ok) throw new Error("Body delivery acknowledgment failed");
      }
      return response;
    }
  </script>

  <main>
    <nav class="page-bar" aria-label="Body navigation">
      <div class="page-links">
        <a href="/portal" id="backToPortal" aria-label="Back to portal">← Portal</a>
      </div>
      <div class="page-links">
        <div id="connectedHostStatus" class="host-status" data-state="loading" aria-live="polite">Checking connected hosts…</div>
      </div>
    </nav>

    <section class="sense-panel" aria-label="Senses">
      <span class="sense-label">Senses</span>
      <button
        id="sensesToggle"
        class="senses-toggle"
        type="button"
        aria-pressed="false"
      >Off</button>
    </section>

    <div id="stage">
      <video id="liveScene" autoplay playsinline muted aria-label="Live camera scene"></video>
    </div>

    <div id="audioMeter" class="audio-meter" aria-label="Microphone input level">
      <div class="audio-meter-label"><span>Hearing</span><span id="audioMeterValue">0%</span></div>
      <div class="audio-meter-track"><div id="audioMeterFill"></div></div>
    </div>

    <section class="sense-status-grid" aria-label="Sensory status">
      <div id="visionSenseStatus" class="sense-status" data-state="idle">
        <strong>Vision</strong><span id="visionSenseStatusText">Waiting for senses to start.</span>
      </div>
      <div id="audioSenseStatus" class="sense-status" data-state="idle">
        <strong>Audio</strong><span id="audioSenseStatusText">Waiting for senses to start.</span>
      </div>
    </section>

    <section class="interaction-panel" aria-label="Conversation">
      <div id="interactionHistory" aria-live="polite"></div>
      <form id="interactionForm" class="interaction-form">
        <textarea
          id="interactionMessage"
          maxlength="8000"
          placeholder="Message"
          aria-label="Message"
          rows="1"
          required
        ></textarea>
        <div class="interaction-actions">
          <button id="clearInteraction" type="button" title="Clear conversation">Clear</button>
          <button id="sendInteraction" type="submit" aria-label="Send interaction">Send</button>
        </div>
      </form>
    </section>

    <video id="video" autoplay playsinline muted hidden></video>
    <canvas id="captureCanvas" hidden></canvas>
    <div id="status" role="status" aria-live="polite">Axiom Body ready. Turn Senses on to activate vision and hearing.</div>
  </main>

  <script type="module">
    import {
      applyVoicePack,
      loadSavedVoicePack
    } from "/static/voice_pack.js";

    const stage = document.getElementById("stage");
    const video = document.getElementById("video");
    const liveScene = document.getElementById("liveScene");
    const audioMeter = document.getElementById("audioMeter");
    const audioMeterFill = document.getElementById("audioMeterFill");
    const audioMeterValue = document.getElementById("audioMeterValue");
    const canvas = document.getElementById("captureCanvas");
    const sensesToggle = document.getElementById("sensesToggle");
    const statusBox = document.getElementById("status");
    const interactionForm = document.getElementById("interactionForm");
    const interactionMessage = document.getElementById("interactionMessage");
    const sendInteractionButton = document.getElementById("sendInteraction");
    const clearInteractionButton = document.getElementById("clearInteraction");
    const interactionHistory = document.getElementById("interactionHistory");
    const chatEmpty = document.getElementById("chatEmpty");
    const backToPortal = document.getElementById("backToPortal");
    const connectedHostStatus = document.getElementById("connectedHostStatus");

    let cameraStream = null;
    let microphoneStream = null;
    let recorder = null;
    let voices = [];
    let sharedVoicePack = loadSavedVoicePack();
    let sharedVoiceRevision = -1;
    let talkEnabled = false;
    let talkListening = false;
    let talkBusy = false;
    let talkSpeaking = false;
    let talkRestartTimer = null;
    let realtimePeer = null;
    let realtimeEvents = null;
    let realtimeMicrophone = null;
    let realtimeAudio = null;
    let realtimeMcpPending = 0;
    let audioContext = null;
    let audioAnalyser = null;
    let audioMeterSource = null;
    let audioMeterOutput = null;
    let audioMeterFrame = null;
    let realtimeResponseDone = false;
    let realtimeResponseUsedMcp = false;
    let sensesEnabled = false;
    let sensoryLoopGeneration = 0;
    let sensoryRequestInFlight = false;
    const AUDIO_IDLE_WINDOW_MS = 4_000;
    const AUDIO_MAX_DURATION_MS = 30_000;
    const AUDIO_SILENCE_MS = 900;
    const AUDIO_SPEECH_THRESHOLD = 0.012;
    const SENSE_PAUSE_MS = 15_000;
    const VISION_INTERVAL_MS = 3_000;
    const DEFAULT_LOOK_SECONDS = 5;
    const MAX_LOOK_SECONDS = 30;
    let boundedLookActive = false;

    function requestedLookDuration(text) {
      const command = String(text || "").trim();
      if (!/\b(?:look|see|watch|camera)\b/i.test(command)) return null;
      const match = command.match(/\b(\d{1,2})\s*(?:seconds?|secs?|s)\b/i);
      return Math.min(MAX_LOOK_SECONDS, Math.max(1, match ? Number(match[1]) : DEFAULT_LOOK_SECONDS));
    }

    async function captureVisualFrame(stream) {
      const track = stream.getVideoTracks()[0];
      if (!track) throw new Error("Camera did not provide a video track.");
      if (liveScene.srcObject !== stream) liveScene.srcObject = stream;
      if (liveScene.paused) await liveScene.play();
      if (!liveScene.videoWidth || !liveScene.videoHeight) await delay(250);
      if (!liveScene.videoWidth || !liveScene.videoHeight) {
        throw new Error("Displayed camera preview did not provide a usable frame.");
      }

      const maxWidth = 960;
      const scale = Math.min(1, maxWidth / liveScene.videoWidth);
      canvas.width = Math.max(1, Math.round(liveScene.videoWidth * scale));
      canvas.height = Math.max(1, Math.round(liveScene.videoHeight * scale));
      canvas.getContext("2d").drawImage(liveScene, 0, 0, canvas.width, canvas.height);

      const ingress = await bodyFetch("/v1/body/eyes/observe", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          image_data_url: canvas.toDataURL("image/jpeg", 0.82),
          width: canvas.width,
          height: canvas.height,
          source: "browser-camera-bounded"
        })
      });
      if (!ingress.ok) throw new Error(await responseErrorMessage(ingress));

      const response = await bodyFetch("/v1/mind/body/see?express=false", { method: "POST" });
      if (!response.ok) throw new Error(await responseErrorMessage(response));
      return await response.json();
    }

    const BODY_DEVICE_STORAGE_KEYS = {
      videoInput: "aicognitive_mind.device.videoInput",
      audioInput: "aicognitive_mind.device.audioInput",
      audioOutput: "aicognitive_mind.device.audioOutput"
    };

    function selectedBodyDeviceId(kind) {
      try { return localStorage.getItem(BODY_DEVICE_STORAGE_KEYS[kind]) || ""; }
      catch (_) { return ""; }
    }

    function bodyMediaConstraints(kind) {
      const deviceId = selectedBodyDeviceId(kind);
      if (kind === "videoInput") {
        return { video: deviceId ? { deviceId: { exact: deviceId } } : true, audio: false };
      }
      return { audio: deviceId ? { deviceId: { exact: deviceId } } : true, video: false };
    }

    async function applyBodyAudioOutput(audioElement) {
      const deviceId = selectedBodyDeviceId("audioOutput");
      if (!deviceId) return;
      if (typeof audioElement.setSinkId !== "function") {
        setStatus("Selected speaker cannot be applied by this browser; using the browser default output.");
        return;
      }
      try {
        await audioElement.setSinkId(deviceId);
      } catch (error) {
        setStatus("Could not use the selected speaker: " + (error?.message || error));
      }
    }

    async function performBoundedLook(seconds, spokenCommand) {
      if (boundedLookActive) return;
      boundedLookActive = true;
      let stream = cameraStream;
      let temporaryStream = false;
      try {
        setStatus("Axiom is looking for " + seconds + " seconds…");
        if (!stream) {
          stream = await navigator.mediaDevices.getUserMedia(bodyMediaConstraints("videoInput"));
          temporaryStream = true;
        }
        const observations = [];
        const sampleCount = Math.min(3, Math.max(1, seconds));
        for (let i = 0; i < sampleCount; i++) {
          if (i > 0) await delay((seconds * 1000) / sampleCount);
          const result = await captureVisualFrame(stream);
          if (result?.response_text) observations.push(result.response_text);
        }
        const remaining = seconds * 1000 - ((sampleCount - 1) * (seconds * 1000) / sampleCount);
        if (remaining > 0) await delay(remaining);

        if (realtimeEvents?.readyState === "open") {
          realtimeEvents.send(JSON.stringify({
            type: "conversation.item.create",
            item: {
              type: "message",
              role: "user",
              content: [{
                type: "input_text",
                text: "Visual observation requested by the human (" + spokenCommand + "). Camera sampled for " +
                  seconds + " seconds. Describe what Axiom observed and answer the human naturally. Observations: " +
                  observations.join("\n---\n")
              }]
            }
          }));
          realtimeEvents.send(JSON.stringify({ type: "response.create" }));
        }
        setStatus("Axiom finished looking. Hands-free voice remains active.");
      } catch (error) {
        setStatus("Bounded camera observation failed: " + error.message);
      } finally {
        if (temporaryStream) stream?.getTracks().forEach((track) => track.stop());
        boundedLookActive = false;
      }
    }
    let hostCameraRequestBusy = false;
    let hostCameraNextPollAt = 0;
    let hostCameraPollDelayMs = 2_500;

    async function checkForHostCameraRequest() {
      if (hostCameraRequestBusy || boundedLookActive || Date.now() < hostCameraNextPollAt) return;
      hostCameraRequestBusy = true;
      try {
        const response = await bodyFetch("/v1/body/camera/request", { cache: "no-store" });
        if (response.status === 429) {
          const retryAfterSeconds = Number(response.headers.get("Retry-After"));
          hostCameraPollDelayMs = Math.min(
            30_000,
            retryAfterSeconds > 0 ? retryAfterSeconds * 1_000 : Math.max(5_000, hostCameraPollDelayMs * 2)
          );
          hostCameraNextPollAt = Date.now() + hostCameraPollDelayMs;
          return;
        }
        if (!response.ok) {
          hostCameraPollDelayMs = Math.min(30_000, Math.max(2_500, hostCameraPollDelayMs * 2));
          hostCameraNextPollAt = Date.now() + hostCameraPollDelayMs;
          return;
        }
        hostCameraPollDelayMs = 2_500;
        hostCameraNextPollAt = Date.now() + hostCameraPollDelayMs;
        const command = await response.json();
        if (!command?.request_id) return;

        let stream = cameraStream;
        let temporaryStream = false;
        try {
          const seconds = Math.min(MAX_LOOK_SECONDS, Math.max(1, Number(command.seconds) || 3));
          setStatus("Axiom camera requested by reasoning host for " + seconds + " seconds…");

          if (!stream) {
            stream = await navigator.mediaDevices.getUserMedia(bodyMediaConstraints("videoInput"));
            temporaryStream = true;
          }

          await delay(seconds * 1000);

          const track = stream.getVideoTracks()[0];
          if (!track) throw new Error("Camera did not provide a video track.");
          if (liveScene.srcObject !== stream) liveScene.srcObject = stream;
          if (liveScene.paused) await liveScene.play();
          if (!liveScene.videoWidth || !liveScene.videoHeight) await delay(250);
          if (!liveScene.videoWidth || !liveScene.videoHeight) {
            throw new Error("Displayed camera preview did not provide a usable frame.");
          }

          const maxWidth = 960;
          const scale = Math.min(1, maxWidth / liveScene.videoWidth);
          canvas.width = Math.max(1, Math.round(liveScene.videoWidth * scale));
          canvas.height = Math.max(1, Math.round(liveScene.videoHeight * scale));
          canvas.getContext("2d").drawImage(liveScene, 0, 0, canvas.width, canvas.height);
          const imageDataUrl = canvas.toDataURL("image/jpeg", 0.82);

          const ingress = await bodyFetch("/v1/body/eyes/observe", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              image_data_url: imageDataUrl,
              width: canvas.width,
              height: canvas.height,
              source: "browser-camera-mcp"
            })
          });
          if (!ingress.ok) throw new Error(await responseErrorMessage(ingress));

          const complete = await bodyFetch("/v1/body/camera/complete", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              request_id: command.request_id,
              image_data_url: imageDataUrl,
              width: canvas.width,
              height: canvas.height
            })
          });
          if (!complete.ok) throw new Error(await responseErrorMessage(complete));
          setStatus("Axiom camera observation delivered to reasoning host.");
        } finally {
          if (temporaryStream) stream?.getTracks().forEach((track) => track.stop());
        }
      } catch (error) {
        setStatus("Host camera observation failed: " + error.message);
        hostCameraPollDelayMs = Math.min(30_000, Math.max(2_500, hostCameraPollDelayMs * 2));
        hostCameraNextPollAt = Date.now() + hostCameraPollDelayMs;
      } finally {
        hostCameraRequestBusy = false;
      }
    }

    let pageSourceSnapshot = null;
    let pageRefreshPending = false;
    let mouthPollBusy = false;
    let pageRefreshProbeBusy = false;

    function setStatus(message) {
      statusBox.textContent = message;
    }

    async function refreshConnectedHostStatus() {
      // This status endpoint must not overlap itself when a response is slower
      // than the five-second refresh interval or the server starts rate limiting.
      if (!connectedHostStatus || document.hidden || refreshConnectedHostStatus.inFlight ||
          Date.now() < (refreshConnectedHostStatus.nextPollAt || 0)) return;
      refreshConnectedHostStatus.inFlight = true;
      try {
        const response = await bodyFetch("/v1/body/hosts/status", { cache: "no-store" });
        if (response.status === 429) {
          const retryAfterSeconds = Number(response.headers.get("Retry-After"));
          refreshConnectedHostStatus.pollDelayMs = Math.min(
            30_000,
            retryAfterSeconds > 0
              ? retryAfterSeconds * 1_000
              : Math.max(5_000, (refreshConnectedHostStatus.pollDelayMs || 5_000) * 2)
          );
          refreshConnectedHostStatus.nextPollAt = Date.now() + refreshConnectedHostStatus.pollDelayMs;
          throw new Error("Host status rate limited");
        }
        if (!response.ok) throw new Error(await responseErrorMessage(response));
        refreshConnectedHostStatus.pollDelayMs = 5_000;
        refreshConnectedHostStatus.nextPollAt = Date.now() + 5_000;
        const status = await response.json();
        const requests = status.requests || {};
        const pending = Number(requests.pending || 0);
        const inProgress = Number(requests.in_progress || 0);
        if (!status.connected || !status.host) {
          connectedHostStatus.dataset.state = "disconnected";
          connectedHostStatus.textContent =
            "No connected host · " + pending + " waiting / " + inProgress + " in progress";
          return;
        }
        const host = status.host;
        const model = host.model ? " · " + host.model : "";
        const heartbeat = status.last_heartbeat_age_seconds == null
          ? "heartbeat unknown"
          : "heartbeat " + status.last_heartbeat_age_seconds + "s ago";
        connectedHostStatus.dataset.state = "connected";
        connectedHostStatus.textContent =
          "Connected host: " + (host.name || "unnamed") + model +
          " · " + (status.lease_remaining_seconds == null ? "persistent connection" : "lease " + status.lease_remaining_seconds + "s") + " · " + heartbeat +
          " · " + pending + " waiting / " + inProgress + " in progress";
      } catch (_) {
        if (Date.now() >= (refreshConnectedHostStatus.nextPollAt || 0)) {
          refreshConnectedHostStatus.pollDelayMs = Math.min(
            30_000, Math.max(5_000, (refreshConnectedHostStatus.pollDelayMs || 5_000) * 2)
          );
          refreshConnectedHostStatus.nextPollAt = Date.now() + refreshConnectedHostStatus.pollDelayMs;
        }
        connectedHostStatus.dataset.state = "unavailable";
        connectedHostStatus.textContent = "Connected-host status unavailable";
      } finally {
        refreshConnectedHostStatus.inFlight = false;
      }
    }

    function setSenseStatus(modality, message, state = "info") {
      const panel = document.getElementById(modality + "SenseStatus");
      const text = document.getElementById(modality + "SenseStatusText");
      if (!panel || !text) return;
      panel.dataset.state = state;
      text.textContent = message;
    }

    function reportSenseFailure(modality, error) {
      const detail = String(error?.message || error || "Unknown error");
      const evidenceAccepted = Boolean(error && typeof error === "object" && error.evidenceAccepted);
      const waitingForHost = /no external reasoning host|no connected external host|standalone fallback is disabled/i.test(detail);
      let message;
      let state;
      if (evidenceAccepted && waitingForHost) {
        message = "Evidence saved; waiting for connected reasoning host: " + detail;
        state = "warning";
      } else if (evidenceAccepted) {
        message = "Evidence saved; interpretation failed: " + detail;
        state = "warning";
      } else if (waitingForHost) {
        message = "Waiting for connected reasoning host: " + detail;
        state = "warning";
      } else {
        message = "Failed: " + detail;
        state = "error";
      }
      setSenseStatus(modality, message, state);
      setStatus((modality === "vision" ? "Vision" : "Audio") + " status\n" + message);
    }

    function bodyIsBusy() {
      return Boolean(
        recorder?.state === "recording" ||
        sensoryRequestInFlight ||
        sendInteractionButton.disabled
      );
    }

    async function checkForBodyPageUpdate() {
      if (document.hidden || pageRefreshProbeBusy) return;
      pageRefreshProbeBusy = true;
      try {
        const response = await bodyFetch(
          window.location.pathname + "?body_refresh_probe=" + Date.now(),
          { cache: "no-store" }
        );
        if (!response.ok) return;
        const source = await response.text();

        if (pageSourceSnapshot === null) {
          pageSourceSnapshot = source;
          return;
        }

        if (source !== pageSourceSnapshot) {
          pageRefreshPending = true;
        }

        if (pageRefreshPending && !bodyIsBusy()) {
          window.location.reload();
        }
      } catch {
        // A failed probe should never interrupt the active Body session.
      } finally {
        pageRefreshProbeBusy = false;
      }
    }

    function loadVoices() {
      voices = window.speechSynthesis?.getVoices?.() || [];
    }

    async function speakIntent(intent) {
      if (!intent?.text) return;
      const metadata = intent.metadata || {};
      const requestedRate = Number(metadata.rate ?? sharedVoicePack?.rate ?? 1);
      const requestedVolume = Number(metadata.volume ?? sharedVoicePack?.volume ?? 1);
      let audioUrl = null;

      try {
        const response = await bodyFetch("/v1/body/speech/fish-audio", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            text: intent.text,
            rate: Number.isFinite(requestedRate) ? requestedRate : 1,
            volume: Number.isFinite(requestedVolume) ? requestedVolume : 1
          })
        });
        if (!response.ok) throw new Error(await responseErrorMessage(response));

        const blob = await response.blob();
        audioUrl = URL.createObjectURL(blob);
        const audio = new Audio(audioUrl);
        await applyBodyAudioOutput(audio);
        audio.volume = 1;
        talkSpeaking = true;
        audio.addEventListener("ended", () => {
          talkSpeaking = false;
          setStatus("VOICE PLAYBACK COMPLETE (Fish Audio)");
          URL.revokeObjectURL(audioUrl);
        }, { once: true });
        audio.addEventListener("error", () => {
          talkSpeaking = false;
          setStatus("Fish Audio playback failed. Check the selected output device and browser audio permissions.");
          URL.revokeObjectURL(audioUrl);
        }, { once: true });
        await audio.play();
        setStatus("VOICE PLAYBACK STARTED (Fish Audio)");
        return;
      } catch (error) {
        talkSpeaking = false;
        if (audioUrl) URL.revokeObjectURL(audioUrl);
        // Keep the Body usable when Fish is not configured during local development,
        // but make the fallback visible rather than implying Fish Audio played.
        if (!window.speechSynthesis) {
          setStatus("Fish Audio speech failed and browser speech is unavailable: " + error.message);
          return;
        }
        setStatus("Fish Audio unavailable; falling back to browser speech: " + error.message);
      }

      loadVoices();
      const utterance = new SpeechSynthesisUtterance(intent.text);
      applyVoicePack(utterance, sharedVoicePack, voices);
      utterance.rate = Math.max(
        0.1,
        Math.min(10, utterance.rate * (Number.isFinite(requestedRate) ? requestedRate : 1))
      );
      utterance.volume = Math.max(
        0,
        Math.min(1, utterance.volume * (Number.isFinite(requestedVolume) ? requestedVolume : 1))
      );
      if (metadata.voice_name) {
        const requestedVoice = voices.find((item) => item.name === metadata.voice_name);
        if (requestedVoice) utterance.voice = requestedVoice;
      }
      utterance.onstart = () => {
        talkSpeaking = true;
        setStatus("VOICE PLAYBACK STARTED (browser speech)");
      };
      utterance.onend = () => {
        talkSpeaking = false;
        setStatus("VOICE PLAYBACK COMPLETE (browser speech)");
      };
      utterance.onerror = (event) => {
        talkSpeaking = false;
        setStatus("Browser speech playback failed: " + (event.error || "unknown speech error"));
      };
      window.speechSynthesis.cancel();
      window.speechSynthesis.speak(utterance);
    }

    function resumeTalking() {
      // Realtime WebRTC owns continuous microphone turn-taking while Talk is enabled.
    }

    async function refreshSharedVoiceSettings() {
      if (document.hidden) return;
      try {
        const response = await bodyFetch("/v1/body/voice/settings", { cache: "no-store" });
        if (!response.ok) return;
        const settings = await response.json();
        if (settings.revision === sharedVoiceRevision) return;
        sharedVoiceRevision = settings.revision;
        if (!settings.revision) return;
        sharedVoicePack = {
          ...loadSavedVoicePack(),
          voiceName: settings.voiceName,
          voiceURI: "",
          rate: settings.rate,
          pitch: settings.pitch,
          volume: settings.volume
        };
      } catch (_) {
        // Keep the last working voice while the network is unavailable.
      }
    }

    function stopTalking(message = "Hands-free conversation stopped.") {
      talkEnabled = false;
      talkListening = false;
      talkBusy = false;
      talkSpeaking = false;
      clearTimeout(talkRestartTimer);
      realtimeMicrophone?.getTracks().forEach((track) => track.stop());
      realtimeEvents?.close();
      realtimePeer?.close();
      if (realtimeAudio) realtimeAudio.srcObject = null;
      realtimeMicrophone = null;
      realtimeEvents = null;
      realtimePeer = null;
      realtimeAudio = null;
      realtimeMcpPending = 0;
      realtimeResponseDone = false;
      realtimeResponseUsedMcp = false;
      setStatus(message);
    }

    function maybeContinueRealtimeAfterMcp() {
      if (
        !talkEnabled ||
        !realtimeResponseDone ||
        !realtimeResponseUsedMcp ||
        realtimeMcpPending !== 0 ||
        realtimeEvents?.readyState !== "open"
      ) return;
      realtimeResponseDone = false;
      realtimeResponseUsedMcp = false;
      realtimeEvents.send(JSON.stringify({ type: "response.create" }));
    }

    async function startTalking() {
      if (!window.RTCPeerConnection || !navigator.mediaDevices?.getUserMedia) {
        setStatus("Realtime voice is unavailable in this browser.");
        return;
      }
      if (sensesEnabled) releaseSenses();
      talkEnabled = true;
      talkBusy = true;
      setStatus("Connecting Axiom voice…");

      try {
        const peer = new RTCPeerConnection();
        realtimePeer = peer;
        realtimeMicrophone = await navigator.mediaDevices.getUserMedia(bodyMediaConstraints("audioInput"));
        for (const track of realtimeMicrophone.getAudioTracks()) {
          peer.addTrack(track, realtimeMicrophone);
        }

        realtimeEvents = peer.createDataChannel("oai-events");
        realtimeEvents.addEventListener("open", () => {
          talkBusy = false;
          talkListening = true;
          setStatus("Axiom is listening.");
        });
        realtimeEvents.addEventListener("message", ({ data }) => {
          let event;
          try { event = JSON.parse(data); } catch (_) { return; }

          if (event.type === "conversation.item.input_audio_transcription.completed") {
            const transcript = event.transcript || "";
            const seconds = requestedLookDuration(transcript);
            if (seconds !== null) {
              performBoundedLook(seconds, transcript);
            }
          } else if (event.type === "response.output_text.done") {
            const text = event.text || "";
            if (text.trim()) speakIntent({ text });
          } else if (event.type === "response.mcp_call.in_progress") {
            realtimeMcpPending += 1;
            realtimeResponseUsedMcp = true;
          } else if (
            event.type === "response.output_item.done" &&
            event.item?.type === "mcp_call"
          ) {
            realtimeMcpPending = Math.max(0, realtimeMcpPending - 1);
            maybeContinueRealtimeAfterMcp();
          } else if (event.type === "response.done") {
            realtimeResponseDone = true;
            maybeContinueRealtimeAfterMcp();
          } else if (event.type === "error") {
            setStatus("Realtime voice error: " + (event.error?.message || "unknown error"));
          }
        });
        realtimeEvents.addEventListener("close", () => {
          if (talkEnabled) stopTalking("Realtime voice disconnected.");
        });

        const offer = await peer.createOffer();
        await peer.setLocalDescription(offer);
        const response = await bodyFetch("/v1/body/realtime/session", {
          method: "POST",
          headers: { "Content-Type": "application/sdp" },
          body: offer.sdp
        });
        if (!response.ok) {
          let detail = "Realtime session creation failed.";
          try { detail = (await response.json()).detail || detail; } catch (_) {}
          throw new Error(detail);
        }
        await peer.setRemoteDescription({
          type: "answer",
          sdp: await response.text()
        });
      } catch (error) {
        stopTalking("Realtime voice failed: " + error.message);
      }
    }

    async function consumeExpressionOutputs() {
      if (mouthPollBusy) return false;
      mouthPollBusy = true;
      try {
        const mouthResponse = await bodyFetch("/v1/body/mouth/next", { cache: "no-store" });
        if (!mouthResponse.ok) return false;
        const mouthIntent = await mouthResponse.json();
        if (!mouthIntent) return false;
        // Dispatch this expression before considering the direct response.
        // This prevents both paths from starting speech for the same interaction.
        await speakIntent(mouthIntent);
        return true;
      } finally {
        mouthPollBusy = false;
      }
    }

    async function pollBodyMouth() {
      if (sensoryRequestInFlight || sendInteractionButton.disabled || mouthPollBusy || talkSpeaking || window.speechSynthesis?.speaking) return;
      try {
        await consumeExpressionOutputs();
      } catch (_) {
        // Speech polling must not interrupt active Body sensing or conversation.
      }
    }

    async function registerActiveBodySession() {
      try {
        await bodyFetch("/v1/body/session/active", { method: "POST" });
      } catch (_) {
        // Keep the Body usable when session registration is temporarily unavailable.
      }
    }

    async function showMindResult(result, { modality, consumeOutputs = true } = {}) {
      const responseLabel = "\n\nMessage:\n" +
        (result.response_text || "No conversational response requested for this sensory sample.");
      const evidence = result.evidence;
      if (!evidence?.sha256 || !evidence?.captured_at || !evidence?.media_type) {
        throw new Error("Sensory input was processed without a complete evidence receipt.");
      }
      setStatus(
        "SENSORY INPUT ADMITTED\n\n" +
        "Evidence saved:\n" +
        evidence.media_type + "\n" +
        "sha256: " + evidence.sha256 + "\n" +
        "captured: " + evidence.captured_at + "\n\n" +
        "Perception:\n" + result.interpretation +
        responseLabel
      );
      const interpreted = Boolean(result.interpretation) &&
        !/^Uninterpreted\b/i.test(result.interpretation);
      setSenseStatus(
        modality,
        "Evidence saved (" + evidence.media_type + ") at " + evidence.captured_at +
          "\nPerception: " + (result.interpretation || "Admitted."),
        interpreted ? "success" : "warning"
      );
      if (consumeOutputs) {
        await consumeExpressionOutputs();
      }
    }

    async function responseErrorMessage(response) {
      const text = await response.text();
      try {
        const payload = JSON.parse(text);
        return payload.detail || text || ("HTTP " + response.status);
      } catch {
        return text || ("HTTP " + response.status);
      }
    }

    function appendChatMessage(role, text, extraClass = "") {
      chatEmpty?.remove();
      const message = document.createElement("div");
      message.className = "chat-message " + role + (extraClass ? " " + extraClass : "");
      message.textContent = text;
      interactionHistory.appendChild(message);
      interactionHistory.scrollTop = interactionHistory.scrollHeight;
      return message;
    }

    function resizeComposer() {
      interactionMessage.style.height = "auto";
      interactionMessage.style.height =
        Math.min(interactionMessage.scrollHeight, 144) + "px";
    }

    async function submitTextInteraction(event) {
      event.preventDefault();
      const message = interactionMessage.value.trim();
      if (!message) return;

      appendChatMessage("user", message);
      interactionMessage.value = "";
      resizeComposer();

      sendInteractionButton.disabled = true;
      talkBusy = true;
      const thinkingMessage = appendChatMessage("mind", "Thinking...");

      try {
        const response = await bodyFetch("/v1/mind/body/interact", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message })
        });
        if (!response.ok) throw new Error(await responseErrorMessage(response));

        const result = await response.json();
        thinkingMessage.textContent = result.response_text;
        setStatus(
          "TEXT INTERACTION COMPLETE\n\n" +
          "You:\n" + message + "\n\n" +
          "Message:\n" + result.response_text
        );
        interactionHistory.scrollTop = interactionHistory.scrollHeight;
        const expressionSpoken = await consumeExpressionOutputs();
        if (talkEnabled && !expressionSpoken && !talkSpeaking) {
          speakIntent({ text: result.response_text });
        }
      } catch (error) {
        thinkingMessage.classList.add("error");
        thinkingMessage.textContent = "Interaction failed: " + error.message;
        setStatus("Text interaction failed: " + error.message);
      } finally {
        sendInteractionButton.disabled = false;
        talkBusy = false;
        if (talkEnabled) resumeTalking();
        else interactionMessage.focus();
      }
    }

    function delay(ms) {
      return new Promise((resolve) => window.setTimeout(resolve, ms));
    }

    function preferredAudioMimeType() {
      const candidates = [
        "audio/webm;codecs=opus",
        "audio/webm",
        "audio/ogg;codecs=opus"
      ];
      return candidates.find((type) => MediaRecorder.isTypeSupported(type)) || "";
    }

    function blobToDataUrl(blob) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = () => reject(reader.error);
        reader.readAsDataURL(blob);
      });
    }

    async function perceiveVision(generation) {
      // Capture from the same element and stream the user sees in the preview.
      // The hidden video element can report dimensions while yielding black frames
      // on some browsers, which made the saved sensory evidence unusable.
      if (
        !sensesEnabled ||
        generation !== sensoryLoopGeneration ||
        !cameraStream ||
        liveScene.readyState < 2 ||
        !liveScene.videoWidth ||
        !liveScene.videoHeight
      ) {
        return;
      }

      const maxWidth = 960;
      const scale = Math.min(1, maxWidth / liveScene.videoWidth);
      canvas.width = Math.max(1, Math.round(liveScene.videoWidth * scale));
      canvas.height = Math.max(1, Math.round(liveScene.videoHeight * scale));
      canvas.getContext("2d").drawImage(liveScene, 0, 0, canvas.width, canvas.height);

      const signature = frameSignature();
      if (lastSuccessfulFrame) {
        let difference = 0;
        for (let i = 0; i < signature.length; i++) difference += Math.abs(signature[i] - lastSuccessfulFrame[i]);
        if (difference / signature.length / 255 < 0.045) return;
      }
      sensoryRequestInFlight = true;
      let evidenceAccepted = false;
      try {
        setStatus("SENSES ON\nSeeing...");
        setSenseStatus("vision", "Capturing frame and saving evidence…", "working");
        const ingress = await bodyFetch("/v1/body/eyes/observe", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            image_data_url: canvas.toDataURL("image/jpeg", 0.82),
            width: canvas.width,
            height: canvas.height,
            source: "browser-camera"
          })
        });
        if (!ingress.ok) throw new Error(await responseErrorMessage(ingress));
        evidenceAccepted = true;
        setSenseStatus("vision", "Frame saved; requesting interpretation…", "warning");
        lastSuccessfulFrame = signature;
        if (!sensesEnabled || generation !== sensoryLoopGeneration) return;

        const response = await bodyFetch(
          "/v1/mind/body/see?express=false",
          { method: "POST" }
        );
        if (!response.ok) throw new Error(await responseErrorMessage(response));
        if (!sensesEnabled || generation !== sensoryLoopGeneration) return;

        lastSuccessfulFrame = signature;
        await showMindResult(await response.json(), { modality: "vision", consumeOutputs: false });
      } catch (error) {
        if (error && typeof error === "object") error.evidenceAccepted = evidenceAccepted;
        throw error;
      } finally {
        sensoryRequestInFlight = false;
      }
    }

    function recordAudioWindow(generation) {
      if (
        !sensesEnabled ||
        generation !== sensoryLoopGeneration ||
        !microphoneStream ||
        !window.MediaRecorder
      ) {
        return Promise.resolve(null);
      }

      return new Promise((resolve, reject) => {
        const mimeType = preferredAudioMimeType();
        const activeRecorder = mimeType
          ? new MediaRecorder(microphoneStream, { mimeType })
          : new MediaRecorder(microphoneStream);
        const chunks = [];
        const startedAt = performance.now();
        let monitorTimer = null;
        let speechDetected = false;
        let silenceStartedAt = 0;
        const clearMonitor = () => {
          if (monitorTimer !== null) window.clearInterval(monitorTimer);
          monitorTimer = null;
        };
        const stopRecording = () => {
          if (activeRecorder.state === "recording") activeRecorder.stop();
        };

        recorder = activeRecorder;
        activeRecorder.addEventListener("dataavailable", (event) => {
          if (event.data.size > 0) chunks.push(event.data);
        });
        activeRecorder.addEventListener("error", (event) => {
          clearMonitor();
          if (recorder === activeRecorder) recorder = null;
          reject(event.error || new Error("Microphone recording failed"));
        }, { once: true });
        activeRecorder.addEventListener("stop", () => {
          clearMonitor();
          if (recorder === activeRecorder) recorder = null;

          if (
            !sensesEnabled ||
            generation !== sensoryLoopGeneration ||
            chunks.length === 0
          ) {
            resolve(null);
            return;
          }

          const durationMs = Math.max(
            1,
            Math.min(AUDIO_MAX_DURATION_MS, Math.round(performance.now() - startedAt))
          );
          resolve({
            blob: new Blob(
              chunks,
              { type: activeRecorder.mimeType || chunks[0]?.type || "audio/webm" }
            ),
            durationMs
          });
        }, { once: true });

        activeRecorder.start();
        monitorTimer = window.setInterval(() => {
          if (activeRecorder.state !== "recording") {
            clearMonitor();
            return;
          }
          const elapsedMs = performance.now() - startedAt;
          if (elapsedMs >= AUDIO_MAX_DURATION_MS) {
            stopRecording();
            return;
          }

          // Follow a complete utterance instead of cutting every sample at a
          // fixed three- or four-second boundary. Use the live mic analyser;
          // no audio is copied into logs or persisted by this monitor.
          let rms = 0;
          if (audioAnalyser) {
            const samples = new Uint8Array(audioAnalyser.fftSize);
            audioAnalyser.getByteTimeDomainData(samples);
            let sum = 0;
            for (const sample of samples) {
              const amplitude = (sample - 128) / 128;
              sum += amplitude * amplitude;
            }
            rms = Math.sqrt(sum / Math.max(1, samples.length));
          }

          if (rms >= AUDIO_SPEECH_THRESHOLD) {
            speechDetected = true;
            silenceStartedAt = 0;
          } else if (speechDetected) {
            if (!silenceStartedAt) silenceStartedAt = performance.now();
            if (
              elapsedMs >= 1_500 &&
              performance.now() - silenceStartedAt >= AUDIO_SILENCE_MS
            ) {
              stopRecording();
            }
          } else if (elapsedMs >= AUDIO_IDLE_WINDOW_MS) {
            // Don't wait the full maximum when the room is quiet.
            stopRecording();
          }
        }, 100);
      });
    }

    async function audioHasSpeechEnergy(blob) {
      const context = new AudioContext();
      try {
        const buffer = await context.decodeAudioData(await blob.arrayBuffer());
        const samples = buffer.getChannelData(0);
        let sum = 0, peak = 0;
        for (const sample of samples) { sum += sample * sample; peak = Math.max(peak, Math.abs(sample)); }
        return Math.sqrt(sum / Math.max(samples.length, 1)) >= 0.008 && peak >= 0.06;
      } finally { await context.close(); }
    }
    let lastSuccessfulFrame = null;
    function frameSignature() {
      const scratch = document.createElement("canvas");
      scratch.width = 12; scratch.height = 8;
      const context = scratch.getContext("2d");
      context.drawImage(canvas, 0, 0, 12, 8);
      return context.getImageData(0, 0, 12, 8).data;
    }

    backToPortal?.addEventListener("click", (event) => {
      // When Body was opened from the portal, return to that exact portal
      // session instead of navigating through the app's login entry point.
      if (document.referrer && new URL(document.referrer).origin === window.location.origin) {
        event.preventDefault();
        window.history.back();
      }
    });

    function stopAudioMeter() {
      if (audioMeterFrame) cancelAnimationFrame(audioMeterFrame);
      audioMeterFrame = null;
      if (audioMeterSource) { try { audioMeterSource.disconnect(); } catch (_) {} }
      audioMeterSource = null;
      if (audioAnalyser) { try { audioAnalyser.disconnect(); } catch (_) {} }
      audioAnalyser = null;
      if (audioMeterOutput) { try { audioMeterOutput.disconnect(); } catch (_) {} }
      audioMeterOutput = null;
      if (audioContext) { try { audioContext.close(); } catch (_) {} }
      audioContext = null;
      audioMeterFill.style.width = "0%";
      audioMeterValue.textContent = "0%";
    }

    async function startAudioMeter(stream) {
      stopAudioMeter();
      const AudioContextClass = window.AudioContext || window.webkitAudioContext;
      if (!AudioContextClass) throw new Error("This browser does not support audio level metering.");
      audioContext = new AudioContextClass();
      if (audioContext.state !== "running") await audioContext.resume();

      audioAnalyser = audioContext.createAnalyser();
      audioAnalyser.fftSize = 1024;
      audioAnalyser.smoothingTimeConstant = 0.35;
      audioMeterSource = audioContext.createMediaStreamSource(stream);
      audioMeterOutput = audioContext.createGain();
      // Keep the analyser in an actively rendered audio graph without
      // monitoring the microphone through the speakers (feedback risk).
      audioMeterOutput.gain.value = 0;
      audioMeterSource.connect(audioAnalyser);
      audioAnalyser.connect(audioMeterOutput);
      audioMeterOutput.connect(audioContext.destination);

      // Byte-domain sampling is more broadly reliable across browser audio
      // implementations than float-domain reads from microphone streams.
      const data = new Uint8Array(audioAnalyser.fftSize);
      const tick = () => {
        if (!audioAnalyser || !audioContext || audioContext.state === "closed") return;
        if (audioContext.state === "suspended") {
          audioContext.resume().catch(() => {});
        }
        audioAnalyser.getByteTimeDomainData(data);
        let sum = 0;
        let peak = 0;
        for (const sample of data) {
          const amplitude = (sample - 128) / 128;
          sum += amplitude * amplitude;
          peak = Math.max(peak, Math.abs(amplitude));
        }
        const rms = Math.sqrt(sum / Math.max(1, data.length));
        // Use a responsive speech-scale gain and a small noise gate. Peak
        // contribution keeps brief consonants visible without pegging silence.
        const level = Math.min(100, Math.round(Math.max(0, rms - 0.002) * 420 + Math.max(0, peak - 0.015) * 18));
        audioMeterFill.style.width = level + "%";
        audioMeterValue.textContent = level + "%";
        audioMeterFrame = requestAnimationFrame(tick);
      };
      tick();
    }

    async function perceiveAudio(generation) {
      if (window.speechSynthesis?.speaking) {
        setSenseStatus("audio", "Listening paused while Axiom is speaking.", "info");
        return;
      }

      setStatus("SENSES ON\nListening...");
      const recording = await recordAudioWindow(generation);
      if (!recording || !sensesEnabled || generation !== sensoryLoopGeneration) {
        if (sensesEnabled && generation === sensoryLoopGeneration) {
          setSenseStatus("audio", "No audio chunk received in this window; retrying.", "warning");
        }
        return;
      }

      if (!await audioHasSpeechEnergy(recording.blob)) {
        setSenseStatus("audio", "Listening; no speech detected in this 4-second window. Nothing sent for interpretation.", "info");
        return;
      }
      sensoryRequestInFlight = true;
      let evidenceAccepted = false;
      try {
        setSenseStatus("audio", "Speech detected; saving audio evidence…", "working");
        const ingress = await bodyFetch("/v1/body/ears/observe", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            audio_data_url: await blobToDataUrl(recording.blob),
            duration_ms: recording.durationMs,
            source: "browser-microphone"
          })
        });
        if (!ingress.ok) throw new Error(await responseErrorMessage(ingress));
        evidenceAccepted = true;
        setSenseStatus("audio", "Audio saved; requesting interpretation…", "warning");
        if (!sensesEnabled || generation !== sensoryLoopGeneration) return;

        const response = await bodyFetch(
          "/v1/mind/body/hear?express=false",
          { method: "POST" }
        );
        if (!response.ok) throw new Error(await responseErrorMessage(response));
        if (!sensesEnabled || generation !== sensoryLoopGeneration) return;

        await showMindResult(await response.json(), { modality: "audio", consumeOutputs: false });
      } catch (error) {
        if (error && typeof error === "object") error.evidenceAccepted = evidenceAccepted;
        throw error;
      } finally {
        sensoryRequestInFlight = false;
      }
    }

    async function runVisionLoop(generation) {
      while (sensesEnabled && generation === sensoryLoopGeneration) {
        if (!document.hidden && !sendInteractionButton.disabled) {
          try {
            await perceiveVision(generation);
          } catch (error) {
            if (sensesEnabled && generation === sensoryLoopGeneration) {
              reportSenseFailure("vision", error);
            }
          }
        }
        await delay(VISION_INTERVAL_MS);
      }
    }

    async function runHearingLoop(generation) {
      while (sensesEnabled && generation === sensoryLoopGeneration) {
        if (!document.hidden && !sendInteractionButton.disabled) {
          try {
            await perceiveAudio(generation);
          } catch (error) {
            if (sensesEnabled && generation === sensoryLoopGeneration) {
              reportSenseFailure("audio", error);
            }
          }
        } else {
          await delay(1_000);
        }
      }
    }

    function startSensoryLoop() {
      const generation = ++sensoryLoopGeneration;
      runVisionLoop(generation);
      runHearingLoop(generation);
    }

    function setSensesUi(enabled) {
      sensesEnabled = enabled;
      sensesToggle.classList.toggle("on", enabled);
      sensesToggle.setAttribute("aria-pressed", String(enabled));
      sensesToggle.textContent = enabled ? "On" : "Off";
    }

    async function enableSenses() {
      if (!navigator.mediaDevices?.getUserMedia) {
        setStatus("This browser does not expose camera and microphone access.");
        setSensesUi(false);
        return;
      }

      sensesToggle.disabled = true;
      try {
        // Acquire each device separately. On mobile browsers, concurrent
        // getUserMedia permission requests can race or cause one request to
        // fail before any Body request ever reaches the server.
        setStatus("SENSES ON\nRequesting camera access...");
        cameraStream = await navigator.mediaDevices.getUserMedia(bodyMediaConstraints("videoInput"));

        setStatus("SENSES ON\nCamera ready. Requesting microphone access...");
        try {
          microphoneStream = await navigator.mediaDevices.getUserMedia(bodyMediaConstraints("audioInput"));
        } catch (error) {
          cameraStream.getTracks().forEach((track) => track.stop());
          cameraStream = null;
          throw new Error("Microphone access failed after camera access succeeded: " + (error?.message || error));
        }
        video.srcObject = cameraStream;
        liveScene.srcObject = cameraStream;
        await video.play();
        await liveScene.play();
        liveScene.style.display = "block";
        audioMeter.style.display = "block";
        await startAudioMeter(microphoneStream);

        setSensesUi(true);
        localStorage.setItem("aicognitive_mind.senses", "on");
        setStatus("SENSES ON\nContinuous vision and hearing are active.");
        startSensoryLoop();
      } catch (error) {
        releaseSenses();
        setStatus("Could not turn senses on: " + error.message);
      } finally {
        sensesToggle.disabled = false;
      }
    }

    function releaseSenses({ persist = true } = {}) {
      sensoryLoopGeneration += 1;
      sensoryRequestInFlight = false;
      if (recorder?.state === "recording") {
        recorder.stop();
      }
      recorder = null;

      if (cameraStream) {
        for (const track of cameraStream.getTracks()) track.stop();
        cameraStream = null;
      }
      if (microphoneStream) {
        for (const track of microphoneStream.getTracks()) track.stop();
        microphoneStream = null;
      }

      video.srcObject = null;
      liveScene.srcObject = null;
      liveScene.style.display = "none";
      audioMeter.style.display = "none";
      stopAudioMeter();
      setSensesUi(false);
      if (persist) {
        localStorage.setItem("aicognitive_mind.senses", "off");
      }
    }

    async function toggleSenses() {
      if (sensesEnabled) {
        releaseSenses();
        setStatus("SENSES OFF\nContinuous perception stopped. Camera and microphone have been released.");
        return;
      }
      await enableSenses();
    }

    interactionForm.addEventListener("submit", submitTextInteraction);
    interactionMessage.addEventListener("input", resizeComposer);
    interactionMessage.addEventListener("keydown", (event) => {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        interactionForm.requestSubmit();
      }
    });
    clearInteractionButton.addEventListener("click", () => {
      interactionMessage.value = "";
      interactionHistory.replaceChildren();
      resizeComposer();
      interactionMessage.focus();
    });

    sensesToggle.addEventListener("click", toggleSenses);

    if (window.speechSynthesis) {
      loadVoices();
      window.speechSynthesis.onvoiceschanged = loadVoices;
    }

    document.addEventListener("visibilitychange", () => {
      if (!document.hidden) {
        checkForBodyPageUpdate();
        refreshSharedVoiceSettings();
        refreshConnectedHostStatus();
      }
    });
    window.addEventListener("beforeunload", () => {
      stopTalking();
      releaseSenses({ persist: false });
      window.speechSynthesis?.cancel();
    });

    registerActiveBodySession();
    refreshSharedVoiceSettings();
    refreshConnectedHostStatus();
    window.setInterval(registerActiveBodySession, 10_000);
    window.setInterval(pollBodyMouth, 1_000);
    window.setInterval(refreshSharedVoiceSettings, 10_000);
    window.setInterval(refreshConnectedHostStatus, 5_000);
    checkForHostCameraRequest();
    // Keep checking after page load so a reasoning host can request a camera
    // observation whenever it attaches, not only during the page's first tick.
    window.setInterval(checkForHostCameraRequest, 1_000);
    checkForBodyPageUpdate();
    window.setInterval(checkForBodyPageUpdate, 12_000);
    if (localStorage.getItem("aicognitive_mind.senses") === "on") {
      enableSenses();
    } else {
      setSensesUi(false);
    }
  </script>
</body>
</html>
