<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Axiom — Ears V0.1</title>
  <link rel="stylesheet" href="/static/body.css">
  <script src="/static/button_icons.js?v=20261016-icon-tooltips" defer></script>
</head>
<body class="body-ears">
  <script>
    const bodySessionId = crypto.randomUUID();
    async function bodyFetch(url, options = {}) {
      const headers = new Headers(options.headers || {});
      headers.set("X-Body-Session", bodySessionId);
      const response = await fetch(url, { ...options, headers, signal: options.signal || AbortSignal.timeout(130000) });
      const receipt = response.headers.get("X-Body-Delivery");
      if (response.ok && receipt) {
        await response.clone().arrayBuffer();
        const ack = await fetch(String(url).split("?")[0].replace(/\/next$/, "/ack") + "?delivery_id=" + encodeURIComponent(receipt),
          { method: "POST", headers, signal: AbortSignal.timeout(10000) });
        if (!ack.ok) throw new Error("Body delivery acknowledgment failed");
      }
      return response;
    }
  </script>

  <main>
    <h1>Ears V0.1</h1>
    <p>The microphone stays on this device. The browser sends one transient audio clip to the remote Body.</p>

    <div class="controls">
      <button id="start">Start listening</button>
      <button id="stop" disabled>Stop and send</button>
    </div>

    <audio id="playback" controls hidden></audio>
    <div id="status">Ears are waiting.</div>
  </main>

  <script>
    const startButton = document.getElementById("start");
    const stopButton = document.getElementById("stop");
    const playback = document.getElementById("playback");
    const statusBox = document.getElementById("status");

    let stream = null;
    let recorder = null;
    let chunks = [];
    let startedAt = 0;
    let stopTimer = null;

    function setStatus(message) {
      statusBox.textContent = message;
    }

    function preferredMimeType() {
      const candidates = [
        "audio/webm;codecs=opus",
        "audio/webm",
        "audio/ogg;codecs=opus"
      ];
      return candidates.find((type) => MediaRecorder.isTypeSupported(type)) || "";
    }

    function releaseMicrophone() {
      if (stream) {
        for (const track of stream.getTracks()) track.stop();
        stream = null;
      }
      if (stopTimer) {
        clearTimeout(stopTimer);
        stopTimer = null;
      }
      startButton.disabled = false;
      stopButton.disabled = true;
    }

    function blobToDataUrl(blob) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = () => reject(reader.error);
        reader.readAsDataURL(blob);
      });
    }

    async function sendClip(blob, durationMs) {
      const audioDataUrl = await blobToDataUrl(blob);

      setStatus("Sending one transient audio clip to the Body...");

      const ingressResponse = await bodyFetch("/v1/body/ears/observe", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          audio_data_url: audioDataUrl,
          duration_ms: durationMs,
          source: "browser-microphone"
        })
      });

      if (!ingressResponse.ok) {
        setStatus("Body rejected the audio clip: " + await ingressResponse.text());
        return;
      }

      const result = await ingressResponse.json();
      playback.hidden = true;

      setStatus(
        "BODY CAN HEAR\n" +
        "source: " + result.sensory_source + "\n" +
        "observed_at: " + result.occurred_at + "\n" +
        "interpretation: " + result.interpretation + "\n" +
        "evidence SHA-256: " + result.evidence.sha256
      );
    }

    async function startListening() {
      if (!navigator.mediaDevices?.getUserMedia || !window.MediaRecorder) {
        setStatus("This browser does not expose microphone recording.");
        return;
      }

      try {
        stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
        const mimeType = preferredMimeType();
        recorder = mimeType
          ? new MediaRecorder(stream, { mimeType })
          : new MediaRecorder(stream);

        chunks = [];
        recorder.addEventListener("dataavailable", (event) => {
          if (event.data.size > 0) chunks.push(event.data);
        });

        recorder.addEventListener("stop", async () => {
          const durationMs = Math.max(1, Math.min(30_000, Math.round(performance.now() - startedAt)));
          const blob = new Blob(chunks, { type: recorder.mimeType || chunks[0]?.type || "audio/webm" });
          releaseMicrophone();

          try {
            await sendClip(blob, durationMs);
          } catch (error) {
            setStatus("Audio transfer failed: " + error.message);
          }
        }, { once: true });

        recorder.start();
        startedAt = performance.now();
        startButton.disabled = true;
        stopButton.disabled = false;
        setStatus("LISTENING\nSpeak now. Recording will stop automatically after 30 seconds. Press Stop and send when finished.");

        stopTimer = setTimeout(() => {
          if (recorder?.state === "recording") recorder.stop();
        }, 30_000);
      } catch (error) {
        releaseMicrophone();
        setStatus("Microphone access failed: " + error.message);
      }
    }

    function stopListening() {
      if (recorder?.state === "recording") recorder.stop();
    }

    startButton.addEventListener("click", startListening);
    stopButton.addEventListener("click", stopListening);
    window.addEventListener("beforeunload", releaseMicrophone);
  </script>
</body>
</html>
